name: Build NextBSD Kernel Extensions
on:
  repository_dispatch:
    types: [kernel-updated]
  push:
    # T10 (nextbsd-ci#12): a merged PR must rebuild + refresh `continuous` the
    # way nextbsd-kernel already does (its push trigger is paths-gated the same
    # way). Without it, a merge to main fired a push event nothing listened for,
    # so the maintainer had to run workflow_dispatch by hand. The pull_request
    # runs never publish (publish is gated on refs/heads/main), so this is the
    # only new publication path: merge = rebuild + publish.
    paths:
      - 'graphics/**'
      - 'tools/check-kext-symbols.py'
      - 'tools/gen-bochs-personalities.sh'
      - 'tools/gen-vboxvideo-personalities.sh'
      - '.github/workflows/build.yml'
      - 'tools/ko2kext.sh'
      - 'tools/gen-iwlwifi-personalities.sh'
      - 'tools/gen-em-personalities.sh'
      - 'tools/gen-i915-personalities.sh'
      - 'tools/gen-amdgpu-personalities.sh'
      - 'tools/gen-radeon-personalities.sh'
      - 'tools/gen-nvidia-personalities.sh'
      - 'tools/nvidia-portpatch.sh'
      - 'tools/nvidia-mkbundle.sh'
      - 'tools/nvidia-activate.sh'
      - 'tests/kext-boot-test.sh'
      - 'tests/personalities-selftest.sh'
  pull_request:
    # Validate the module cross-build (both arches) on PRs touching the
    # workflow. The kernel obj tree now comes from nextbsd-kernel's rolling
    # `continuous` release (always present), so a PR needs no run_id, and PR
    # runs never publish — see the publish job's `if`.
    paths:
      # The vendored DRM sources are the most fragile code here and were, until
      # now, the one thing PRs did not build. Every graphics PR so far got CI
      # only incidentally, because it happened to also touch build.yml or
      # tests/ -- a graphics-only change (like the VRAM fictitious-range fix)
      # silently got no validation at all.
      - 'graphics/**'
      - 'tools/check-kext-symbols.py'
      - 'tools/gen-bochs-personalities.sh'
      - 'tools/gen-vboxvideo-personalities.sh'
      - '.github/workflows/build.yml'
      - 'tools/ko2kext.sh'
      - 'tools/gen-iwlwifi-personalities.sh'
      - 'tools/gen-em-personalities.sh'
      - 'tools/gen-i915-personalities.sh'
      - 'tools/gen-amdgpu-personalities.sh'
      - 'tools/gen-radeon-personalities.sh'
      - 'tools/gen-nvidia-personalities.sh'
      - 'tools/nvidia-portpatch.sh'
      - 'tools/nvidia-mkbundle.sh'
      - 'tools/nvidia-activate.sh'
      - 'tests/kext-boot-test.sh'
      - 'tests/personalities-selftest.sh'
  workflow_dispatch:
    inputs:
      fbsd_sha:
        description: 'Pinned FreeBSD SHA for the toolchain image tag (blank = latest)'
        required: false
        default: ''

env:
  FREEBSD_BRANCH: releng/15.0
  # Modules that MUST build. A missing .ko for one of these fails the job.
  #
  # The `continue-on-error: true` on each build step below is deliberate and
  # stays: these steps exist to PRINT the missing symbols and headers, and
  # serialising them would waste a CI cycle measuring one gap at a time. What
  # was wrong is that the job then went green regardless, so a module that used
  # to build could stop building and nothing said so -- twice a hard compile
  # failure in drm_dma_helpers was reported as success and only found by
  # reading the log.
  #
  # So the build steps stay non-gating and the summarize steps gate instead:
  # each one already knows whether its .ko exists, and now fails if the module
  # is named here. A module still being ported is simply absent from the list
  # and keeps reporting its gaps without failing anything -- which is how
  # drm_dma_helpers should behave until nextbsd-kernel#181 lands the linuxkpi
  # symbols it needs. Add it here once it builds.
  REQUIRED_KOS: "drm_extra_helpers bochs vboxvideo linux_virtio drm_shmem_helpers virtio_gpu_drm drm_dma_helpers"
  # drm-kmod is pinned to a release tag, not the moving `6.12-lts` branch.
  # The branch takes upstream churn between releases, and on 2026-09-16
  # 75dc0eaf74 ("drm/fb-helper: Allocate and release fb_info in single place")
  # removed drm_fb_helper_alloc_info(), which broke our vendored
  # graphics/drivers/gpu/drm/drm_fbdev_shmem.c on the next rebuild with no
  # change on our side. Bump this deliberately: re-check that
  # graphics/drm-kmod-patches apply in order and that the vendored DRM sources
  # under graphics/ still match the new tag's API.
  DRM_KMOD_REF: drm_v6.12.85_3

jobs:
  modules:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: amd64
            target_arch: amd64
          - target: arm64
            target_arch: aarch64
    container:
      # Same per-arch toolchain image the kernel was built in, so module source
      # matches. Cross-builds on the x86_64 runner (no emulation).
      image: ghcr.io/nextbsd/nextbsd-kernel-toolchain:${{ matrix.target }}-${{ (github.event.client_payload.fbsd_sha || inputs.fbsd_sha) && format('fbsd-{0}', github.event.client_payload.fbsd_sha || inputs.fbsd_sha) || 'latest' }}
    steps:
      - name: Download kernel obj tree from kernel continuous release
        env:
          # Reads a public `continuous` release asset — no PAT needed; the
          # built-in github.token authenticates gh for public reads and lets
          # fork PRs run this step (they get a read-only github.token, no secrets).
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /usr/obj
          # Pull the CI-gated kernel obj tree from nextbsd-kernel's rolling
          # `continuous` release. It's always present (only a green main build
          # refreshes it) and needs no run_id — which is what lets this build
          # run on PRs. The tarball is rooted at /usr/obj's contents, so it
          # restores the same layout the old download-artifact produced.
          gh release download continuous \
            --repo nextbsd/nextbsd-kernel \
            --pattern "kernel-obj-${{ matrix.target }}.tar.gz" \
            --output /tmp/kernel-obj.tar.gz --clobber
          tar -C /usr/obj -xzf /tmp/kernel-obj.tar.gz

      - name: Apply patches to source
        run: |
          cd /usr/src
          # /usr/src in the container is the unpatched baked tree; re-apply the
          # same patches + config the kernel was built with.
          git clone --depth 1 https://github.com/nextbsd/nextbsd-kernel.git /tmp/nk
          for p in $(cat /tmp/nk/patches/series); do
            echo "Applying $p"
            git apply /tmp/nk/patches/$p
          done
          cp /tmp/nk/config/NEXTBSD /usr/src/sys/${{ matrix.target }}/conf/

      - name: Build modules
        run: |
          cd /usr/src
          # --cross-bindir points at the external Clang 19 cross toolchain
          # (CROSS_BINDIR), inherited from the toolchain image ENV.
          # NO_KERNEL=yes builds modules against the already-built kernel obj.
          ./tools/build/make.py \
            --cross-bindir="${CROSS_BINDIR}" \
            TARGET="${{ matrix.target }}" \
            TARGET_ARCH="${{ matrix.target_arch }}" \
            KERNCONF=NEXTBSD \
            NO_KERNEL=yes \
            buildkernel -j"$(nproc)"

      # P1 (#213): generate the IntelWiFi IOKitPersonalities (device-id match
      # table) from the iwlwifi driver source in /usr/src — the data the
      # in-kernel IOService matcher (K2/K3) reads to bind the driver. Apple kexts
      # carry this in Info.plist; we derive it from the driver's own PCI id table
      # (faithful + robust — no kldxref needed). amd64 only (arch-independent;
      # IntelWiFi.kext is amd64); uploaded for the kext + publish jobs.
      - name: Checkout tools (for the personalities generator)
        if: matrix.target == 'amd64'
        uses: actions/checkout@v4
        with:
          path: nbkm-tools

      - name: Generate IntelWiFi IOKitPersonalities (P1 #213)
        if: matrix.target == 'amd64'
        run: |
          chmod +x nbkm-tools/tools/gen-iwlwifi-personalities.sh
          DRV=/usr/src/sys/contrib/dev/iwlwifi/pcie/drv.c
          test -f "$DRV" || { echo "iwlwifi drv.c not found at $DRV" >&2; exit 1; }
          mkdir -p personalities
          nbkm-tools/tools/gen-iwlwifi-personalities.sh "$DRV" \
              org.nextbsd.kext.intelwifi IntelWiFi > personalities/IntelWiFi.iokitpersonalities
          echo "=== generated ==="
          cat personalities/IntelWiFi.iokitpersonalities

      - name: Upload IntelWiFi personalities artifact
        if: matrix.target == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: intelwifi-personalities
          path: personalities/IntelWiFi.iokitpersonalities

      # #219 (D1): generate the IntelEthernet IOKitPersonalities from the e1000
      # driver's PVID tables (em + igb) in /usr/src — same approach as IntelWiFi,
      # but the e1000 device ids are symbolic (E1000_DEV_ID_*) and resolved from
      # e1000_hw.h. amd64 only (arch-independent); uploaded for the kext + publish
      # jobs.
      - name: Generate IntelEthernet IOKitPersonalities (#219)
        if: matrix.target == 'amd64'
        run: |
          chmod +x nbkm-tools/tools/gen-em-personalities.sh
          E1000=/usr/src/sys/dev/e1000
          test -f "$E1000/if_em.c" || { echo "e1000 driver not found at $E1000" >&2; exit 1; }
          mkdir -p personalities
          nbkm-tools/tools/gen-em-personalities.sh "$E1000" \
              org.nextbsd.kext.intelethernet IntelEthernet > personalities/IntelEthernet.iokitpersonalities
          echo "=== generated ==="
          cat personalities/IntelEthernet.iokitpersonalities

      - name: Upload IntelEthernet personalities artifact
        if: matrix.target == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: intelethernet-personalities
          path: personalities/IntelEthernet.iokitpersonalities

      - name: Upload modules artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextbsd-modules-${{ matrix.target }}
          path: /usr/obj/**/modules/

      - name: Create release
        if: github.event.client_payload.release == 'true'
        run: |
          cd /usr/obj
          tar czf /tmp/nextbsd-modules-${{ matrix.target }}.tar.gz $(find . -type d -name modules)
          # Per-arch tag so the two matrix legs don't collide on one release.
          gh release create "v$(date +%Y%m%d)-modules-${{ matrix.target }}" \
            /tmp/nextbsd-modules-${{ matrix.target }}.tar.gz \
            --repo nextbsd/nextbsd-kernel-extensions \
            --title "NextBSD Modules ${{ matrix.target }} $(date +%Y-%m-%d)" \
            --notes "Built against FreeBSD ${FREEBSD_BRANCH}"
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}

  # EXPERIMENTAL (graphics kext series, step 1): prove the drm-kmod graphics
  # drivers BUILD against our patched kernel obj before we wrap them into kexts.
  # `6.12-lts` is the drm-kmod branch matching FreeBSD releng/15.1 (the
  # graphics/drm-612-kmod port line; needs __FreeBSD_version >= 1500509, #336/#337).
  # drm-kmod is out-of-tree (its own
  # `make SYSDIR=...`, not the kernel's make.py), so we cross-build it inside
  # FreeBSD's `buildenv` (which sets MACHINE + the cross compiler + exposes the
  # kernel opt headers from /usr/obj). Compile-only: IOGraphics.kext + the
  # per-vendor GPU kexts come once these .ko's exist. amd64 first. Independent
  # job — does NOT gate publish (publish needs: modules), so it can be iterated
  # freely while we settle the cross-build.
  drm-kmod:
    name: drm-kmod build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: amd64
            target_arch: amd64
          # arm64: drm-kmod's own Makefile lists aarch64 in SUPPORTED_ARCH and
          # kconfig.mk has an explicit aarch64 branch, so the source tree
          # supports it -- but the FreeBSD PORT is deliberately narrower
          # (ONLY_FOR_ARCHS = amd64 powerpc64 powerpc64le), so nobody ships
          # this combination and it is genuinely unmeasured. That is what this
          # leg is for. fail-fast is off so an arm64 failure cannot take the
          # proven amd64 leg down with it.
          - target: arm64
            target_arch: aarch64
    container:
      image: ghcr.io/nextbsd/nextbsd-kernel-toolchain:${{ matrix.target }}-${{ (github.event.client_payload.fbsd_sha || inputs.fbsd_sha) && format('fbsd-{0}', github.event.client_payload.fbsd_sha || inputs.fbsd_sha) || 'latest' }}
    steps:
      - name: Download kernel obj tree from kernel continuous release
        env:
          # Reads a public `continuous` release asset — no PAT needed; the
          # built-in github.token authenticates gh for public reads and lets
          # fork PRs run this step (they get a read-only github.token, no secrets).
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /usr/obj
          gh release download continuous \
            --repo nextbsd/nextbsd-kernel \
            --pattern "kernel-obj-${{ matrix.target }}.tar.gz" \
            --output /tmp/kernel-obj.tar.gz --clobber
          tar -C /usr/obj -xzf /tmp/kernel-obj.tar.gz

      - name: Apply patches to source
        run: |
          cd /usr/src
          # Same patches + config the kernel was built with (the baked /usr/src
          # is unpatched), so drm-kmod compiles against the real NextBSD KBI.
          git clone --depth 1 https://github.com/nextbsd/nextbsd-kernel.git /tmp/nk
          for p in $(cat /tmp/nk/patches/series); do
            echo "Applying $p"
            git apply /tmp/nk/patches/$p
          done
          cp /tmp/nk/config/NEXTBSD /usr/src/sys/${{ matrix.target }}/conf/

      - name: Checkout tools (ko2kext + personality generators)
        uses: actions/checkout@v4
        with:
          path: nbkm-tools

      - name: Build drm-kmod (${{ env.DRM_KMOD_REF }}) against the kernel obj
        run: |
          git clone --depth 1 --branch "${DRM_KMOD_REF}" \
            https://github.com/freebsd/drm-kmod.git /tmp/drm-kmod
          # Local fixes to drm-kmod itself, applied to the fresh clone. Kept as
          # patches rather than vendored files because these belong to modules
          # drm-kmod's own Makefile builds (drm.ko), so a copy under
          # graphics/drivers/ would never be compiled in their place.
          #
          # NOT guarded by `if [ -d ... ]`. An earlier version was, and when the
          # repo checkout turned out to happen LATER in this job the directory
          # did not exist, the loop skipped, and the build went green having
          # applied nothing -- the patch's absence was only caught by grepping
          # format strings out of the built .ko. Missing patches now fail here.
          PATCHDIR="$GITHUB_WORKSPACE/nbkm-tools/graphics/drm-kmod-patches"
          if [ -d "$PATCHDIR" ]; then
            for p in "$PATCHDIR"/*.patch; do
              [ -e "$p" ] || continue
              echo "==> applying $(basename "$p")"
              patch -d /tmp/drm-kmod -p1 --batch --forward < "$p" || {
                echo "::error::failed to apply $(basename "$p")"; exit 1; }
            done
          else
            echo "::error::$PATCHDIR missing -- repo not checked out before the drm-kmod build"
            exit 1
          fi
          NPROC=$(nproc)
          cd /usr/src
          ./tools/build/make.py \
            --cross-bindir="${CROSS_BINDIR}" \
            TARGET=${{ matrix.target }} TARGET_ARCH=${{ matrix.target_arch }} KERNCONF=NEXTBSD \
            buildenv BUILDENV_SHELL="make -C /tmp/drm-kmod -j${NPROC} SYSDIR=/usr/src/sys"

      - name: Collect + list drm-kmod .ko output
        run: |
          # Objs may land in-tree or under MAKEOBJDIRPREFIX, so search both.
          mkdir -p /tmp/ko-out
          find /tmp/drm-kmod "${MAKEOBJDIRPREFIX:-/usr/obj}" -name '*.ko' 2>/dev/null \
            -exec cp -v {} /tmp/ko-out/ \; || true
          echo "=== collected .ko files ==="
          ls -lh /tmp/ko-out || true
          echo "=== drivers we need for the graphics kexts ==="
          for ko in drm i915kms amdgpu radeonkms ttm; do
            if [ -f "/tmp/ko-out/${ko}.ko" ]; then echo "  OK   ${ko}.ko"; else echo "  MISS ${ko}.ko"; fi
          done
          # drm.ko + the GPU drivers are the must-haves; ttm may be folded into drm.
          #
          # i915 is required on amd64 and MUST NOT be expected on arm64: drm-kmod's
          # top-level Makefile adds it to DEFAULT_KMODS only for amd64/i386
          # (there is no Intel iGPU on aarch64), so its absence there is correct
          # rather than a build failure. amdgpu and radeonkms ARE expected on both:
          # discrete AMD cards in an arm64 machine's PCIe slot are a real
          # configuration, and drm-kmod builds them for aarch64 by default.
          # What must build is what we SHIP. amd64 ships all four; arm64 ships
          # the DRM core and helpers only, so drm.ko is the whole requirement
          # there -- amdgpu/radeonkms still build as drm-kmod defaults and are
          # reported above, but their state cannot fail a build that does not
          # package them.
          if [ "${{ matrix.target }}" = "amd64" ]; then
            REQUIRED="drm amdgpu radeonkms i915kms"
          else
            REQUIRED="drm"
          fi
          for ko in $REQUIRED; do
            test -f "/tmp/ko-out/${ko}.ko" || { echo "FAIL: required ${ko}.ko not built" >&2; exit 1; }
          done
          echo "drm-kmod (${{ matrix.target }}) built: $REQUIRED"

      - name: Upload drm-kmod modules artifact
        uses: actions/upload-artifact@v4
        with:
          name: drm-kmod-modules-${{ matrix.target }}
          path: /tmp/ko-out/*.ko
          if-no-files-found: warn

      # --- Wrap the built .ko's into kexts (graphics step 2) ---------------------
      # Now that drm-kmod compiles clean against our kernel, prove the full kext
      # bundle structure: generate each driver's device-id personalities from the
      # REAL drm-kmod source (not fixtures), wrap drm/ttm/dmabuf + the three GPU
      # drivers into kexts with the right OSBundleLibraries dependency chain, and
      # validate every Info.plist. Firmware (per-vendor, ko2kext -f) + the on-real-
      # HW load test come next; this proves the bundles + matching + de-overlap are
      # correct end to end.
      # EXPERIMENTAL (graphics kext series, step 2): build the DRM GEM/KMS
      # helper layer drm-kmod does not compile. Per the graphics plan, the real
      # cost of every small virtual-GPU driver (bochs, vboxvideo, virtio-gpu) is
      # NOT the driver .c file -- it is these helpers, which drm-kmod omits:
      #
      #   drm_simple_kms_helper.c   ~460 LOC, pure drm-core     (bochs)
      #   drm_gem_vram_helper.c    ~1130 LOC, TTM-coupled       (bochs, vboxvideo)
      #
      # Built ONCE as drm_extra_helpers.ko and exported, so two drivers can not
      # collide on EXPORT_SYMS. Sources are vendored UNMODIFIED from Linux v6.12
      # (matching drm-kmod 6.12-lts) under graphics/ in this repo; the drm-kmod
      # checkout at /tmp/drm-kmod stays an untouched upstream clone apart from
      # this build-time vendoring, so it remains rebaseable.
      #
      # Compile-only, and deliberately non-gating while the linuxkpi gaps are
      # being closed: the point of this step right now is to PRINT the missing
      # symbols/headers, turning the plan's "1-2 weeks, blocker = vram helper"
      # estimate into a measured task list.
      - name: Build drm_extra_helpers.ko (vendored DRM helpers)
        continue-on-error: true
        run: |
          set -eu
          cp nbkm-tools/graphics/drivers/gpu/drm/*.c /tmp/drm-kmod/drivers/gpu/drm/
          cp nbkm-tools/graphics/include/drm/*.h     /tmp/drm-kmod/include/drm/
          cp -R nbkm-tools/graphics/drm_extra_helpers /tmp/drm-kmod/
          NPROC=$(nproc)
          cd /usr/src
          ./tools/build/make.py \
            --cross-bindir="${CROSS_BINDIR}" \
            TARGET=${{ matrix.target }} TARGET_ARCH=${{ matrix.target_arch }} KERNCONF=NEXTBSD \
            buildenv BUILDENV_SHELL="make -C /tmp/drm-kmod/drm_extra_helpers -j${NPROC} SYSDIR=/usr/src/sys" \
            2>&1 | tee /tmp/extra-helpers-build.log
          # Stage next to the drm-kmod .ko's so the wrap step finds it (that
          # step's collect ran before this one).
          cp /tmp/drm-kmod/drm_extra_helpers/drm_extra_helpers.ko /tmp/ko-out/ 2>/dev/null || true

      - name: Summarize helper build gaps
        if: always()
        run: |
          if [ -f /tmp/drm-kmod/drm_extra_helpers/drm_extra_helpers.ko ]; then
            echo "HELPERS-OK: drm_extra_helpers.ko built"
            ls -lh /tmp/drm-kmod/drm_extra_helpers/drm_extra_helpers.ko
            exit 0
          fi
          echo "HELPERS-INCOMPLETE — measured gaps follow (this is the deliverable)"
          echo "=== missing headers ==="
          grep -oE "fatal error: '[^']+' file not found" /tmp/extra-helpers-build.log 2>/dev/null | sort -u || true
          echo "=== undeclared identifiers / implicit decls ==="
          grep -oE "(use of undeclared identifier|implicit declaration of function) '[^']+'" /tmp/extra-helpers-build.log 2>/dev/null | sort -u | head -60 || true
          echo "=== incomplete types ==="
          grep -oE "incomplete type '[^']+'" /tmp/extra-helpers-build.log 2>/dev/null | sort -u | head -30 || true
          echo "=== error count ==="
          # ": error:" not "error:" -- a bare match also counts the grep
          # commands echoed into the log by `set -x`/step rendering, which
          # inflated every count in the first runs and made a clean driver
          # build read as 4 errors. Compiler diagnostics are always
          # file:line:col: error:.
          ERRS=$(grep -c ": error:" /tmp/extra-helpers-build.log 2>/dev/null) || ERRS=0
          echo "$ERRS"
          # Gate. On the REQUIRED_KOS list, a missing .ko is a build
          # failure rather than a measurement, and the gaps printed
          # above are the diagnosis rather than the deliverable.
          case " $REQUIRED_KOS " in
            *" drm_extra_helpers "*)
              echo "::error::drm_extra_helpers.ko did not build ($ERRS compiler errors) -- see the gaps above"
              exit 1 ;;
          esac

      # EXPERIMENTAL (graphics kext series, step 3): bochs, the plan's P0 driver.
      # Binds qemu's DEFAULT -vga std (1234:1111), so it device-matches in CI
      # with no qemu reconfiguration, and matches as a raw IOPCIPrimaryMatch node
      # -- reusing the existing match/kextd/load/bind machinery unchanged.
      # Vendored UNMODIFIED from Linux v6.12. Runs even when the helper module
      # above fails, because the two failure sets are what we are here to
      # measure and serializing them wastes a CI cycle.
      - name: Build bochs.ko (vendored Linux 6.12 tiny/bochs.c)
        if: matrix.target == 'amd64'
        continue-on-error: true
        run: |
          set -eu
          mkdir -p /tmp/drm-kmod/drivers/gpu/drm/tiny
          cp nbkm-tools/graphics/drivers/gpu/drm/tiny/*.c /tmp/drm-kmod/drivers/gpu/drm/tiny/
          cp -R nbkm-tools/graphics/bochs /tmp/drm-kmod/
          NPROC=$(nproc)
          cd /usr/src
          ./tools/build/make.py \
            --cross-bindir="${CROSS_BINDIR}" \
            TARGET=${{ matrix.target }} TARGET_ARCH=${{ matrix.target_arch }} KERNCONF=NEXTBSD \
            buildenv BUILDENV_SHELL="make -C /tmp/drm-kmod/bochs -j${NPROC} SYSDIR=/usr/src/sys" \
            2>&1 | tee /tmp/bochs-build.log
          cp /tmp/drm-kmod/bochs/bochs.ko /tmp/ko-out/ 2>/dev/null || true

      - name: Summarize bochs build gaps
        if: always() && matrix.target == 'amd64'
        run: |
          if [ -f /tmp/drm-kmod/bochs/bochs.ko ]; then
            echo "BOCHS-OK: bochs.ko built"; ls -lh /tmp/drm-kmod/bochs/bochs.ko; exit 0
          fi
          echo "BOCHS-INCOMPLETE — measured gaps follow"
          echo "=== missing headers ==="
          grep -oE "fatal error: '[^']+' file not found" /tmp/bochs-build.log 2>/dev/null | sort -u || true
          echo "=== undeclared identifiers / implicit decls ==="
          grep -oE "(use of undeclared identifier|implicit declaration of function) '[^']+'" /tmp/bochs-build.log 2>/dev/null | sort -u | head -60 || true
          echo "=== incomplete types ==="
          grep -oE "incomplete type '[^']+'" /tmp/bochs-build.log 2>/dev/null | sort -u | head -30 || true
          echo "=== error count ==="
          # ": error:" not "error:" -- a bare match also counts the grep
          # commands echoed into the log by `set -x`/step rendering, which
          # inflated every count in the first runs and made a clean driver
          # build read as 4 errors. Compiler diagnostics are always
          # file:line:col: error:.
          ERRS=$(grep -c ": error:" /tmp/bochs-build.log 2>/dev/null) || ERRS=0
          echo "$ERRS"
          # Gate. On the REQUIRED_KOS list, a missing .ko is a build
          # failure rather than a measurement, and the gaps printed
          # above are the diagnosis rather than the deliverable.
          case " $REQUIRED_KOS " in
            *" bochs "*)
              echo "::error::bochs.ko did not build ($ERRS compiler errors) -- see the gaps above"
              exit 1 ;;
          esac

      # EXPERIMENTAL (graphics kext series, step 4): vboxvideo (80ee:beef).
      # The cheapest driver in the plan, and cheap because bochs went first --
      # it needs the same three helpers, which already build and ship as
      # drm_extra_helpers.ko. Unlike bochs it does NOT bind anything in CI
      # (qemu has no VirtualBox GPU), so this proves compile + kext packaging;
      # attach is proven on a VirtualBox guest.
      #
      # Two extra vendored pieces beyond the driver: lib/genalloc.c (linuxkpi
      # ships no gen_pool, and vboxvideo carves its HGSMI guest heap out of the
      # VRAM tail with one) and include/uapi/linux/vbox_err.h (the VirtualBox
      # guest status codes; a uapi header on Linux, hence the <linux/...>
      # spelling the -I../include/uapi path reproduces).
      - name: Build vboxvideo.ko (vendored Linux 6.12 vboxvideo/ + lib/genalloc.c)
        if: matrix.target == 'amd64'
        continue-on-error: true
        run: |
          set -eu
          mkdir -p /tmp/drm-kmod/drivers/gpu/drm/vboxvideo /tmp/drm-kmod/lib
          mkdir -p /tmp/drm-kmod/include/linux /tmp/drm-kmod/include/uapi/linux
          cp nbkm-tools/graphics/drivers/gpu/drm/vboxvideo/* /tmp/drm-kmod/drivers/gpu/drm/vboxvideo/
          cp nbkm-tools/graphics/lib/*.c                     /tmp/drm-kmod/lib/
          cp nbkm-tools/graphics/include/linux/*.h           /tmp/drm-kmod/include/linux/
          cp nbkm-tools/graphics/include/uapi/linux/*.h      /tmp/drm-kmod/include/uapi/linux/
          cp -R nbkm-tools/graphics/vboxvideo /tmp/drm-kmod/
          NPROC=$(nproc)
          cd /usr/src
          ./tools/build/make.py \
            --cross-bindir="${CROSS_BINDIR}" \
            TARGET=${{ matrix.target }} TARGET_ARCH=${{ matrix.target_arch }} KERNCONF=NEXTBSD \
            buildenv BUILDENV_SHELL="make -C /tmp/drm-kmod/vboxvideo -j${NPROC} SYSDIR=/usr/src/sys" \
            2>&1 | tee /tmp/vboxvideo-build.log
          cp /tmp/drm-kmod/vboxvideo/vboxvideo.ko /tmp/ko-out/ 2>/dev/null || true

      - name: Summarize vboxvideo build gaps
        if: always() && matrix.target == 'amd64'
        run: |
          if [ -f /tmp/drm-kmod/vboxvideo/vboxvideo.ko ]; then
            echo "VBOX-OK: vboxvideo.ko built"; ls -lh /tmp/drm-kmod/vboxvideo/vboxvideo.ko; exit 0
          fi
          echo "VBOX-INCOMPLETE — measured gaps follow"
          echo "=== missing headers ==="
          grep -oE "fatal error: '[^']+' file not found" /tmp/vboxvideo-build.log 2>/dev/null | sort -u || true
          echo "=== undeclared identifiers / implicit decls ==="
          grep -oE "(use of undeclared identifier|implicit declaration of function) '[^']+'" /tmp/vboxvideo-build.log 2>/dev/null | sort -u | head -60 || true
          echo "=== incomplete types ==="
          grep -oE "incomplete type '[^']+'" /tmp/vboxvideo-build.log 2>/dev/null | sort -u | head -30 || true
          echo "=== undefined symbols at link ==="
          grep -oE "undefined symbol: [A-Za-z0-9_]+" /tmp/vboxvideo-build.log 2>/dev/null | sort -u | head -40 || true
          echo "=== first 40 error lines ==="
          grep -E "error:" /tmp/vboxvideo-build.log 2>/dev/null | head -40 || true
          echo "=== error count ==="
          # ": error:" not "error:" -- a bare match also counts the grep
          # commands echoed into the log by `set -x`/step rendering, which
          # inflated every count in the first runs and made a clean driver
          # build read as 4 errors. Compiler diagnostics are always
          # file:line:col: error:.
          ERRS=$(grep -c ": error:" /tmp/vboxvideo-build.log 2>/dev/null) || ERRS=0
          echo "$ERRS"
          # Gate. On the REQUIRED_KOS list, a missing .ko is a build
          # failure rather than a measurement, and the gaps printed
          # above are the diagnosis rather than the deliverable.
          case " $REQUIRED_KOS " in
            *" vboxvideo "*)
              echo "::error::vboxvideo.ko did not build ($ERRS compiler errors) -- see the gaps above"
              exit 1 ;;
          esac

      # EXPERIMENTAL (graphics kext series, step 5): the LinuxKPI virtio shim.
      #
      # Runs on BOTH arches, unlike bochs and vboxvideo, because virtio-gpu is
      # the arm64 KMS story specifically -- qemu's arm64 virt machine has no VGA
      # device for bochs to bind and VirtualBox guests are x86, so this is the
      # first graphics work where the arm64 leg is the point rather than a
      # bonus. It matters equally on amd64: a QEMU/KVM guest gets the same
      # driver, and the amd64 lane is where it can actually be boot-tested.
      #
      # FreeBSD base ships no linuxkpi virtio at all -- sys/compat/linuxkpi has
      # no <linux/virtio.h> -- so this is the piece the plan spent the longest
      # assuming would need a base change. It does not: FreeBSD's public
      # virtqueue KPI already covers the Linux one, with virtqueue_notify()
      # folding in the kick_prepare decision. The shim is ~600 lines of
      # BSD-2-Clause code in OUR repo.
      - name: Build linux_virtio.ko (LinuxKPI virtio shim)
        continue-on-error: true
        run: |
          set -eu
          mkdir -p /tmp/drm-kmod/include/linux /tmp/drm-kmod/include/uapi/linux
          cp nbkm-tools/graphics/include/linux/*.h      /tmp/drm-kmod/include/linux/
          cp nbkm-tools/graphics/include/uapi/linux/*.h /tmp/drm-kmod/include/uapi/linux/
          cp -R nbkm-tools/graphics/linuxkpi_virtio /tmp/drm-kmod/
          NPROC=$(nproc)
          cd /usr/src
          ./tools/build/make.py \
            --cross-bindir="${CROSS_BINDIR}" \
            TARGET=${{ matrix.target }} TARGET_ARCH=${{ matrix.target_arch }} KERNCONF=NEXTBSD \
            buildenv BUILDENV_SHELL="make -C /tmp/drm-kmod/linuxkpi_virtio -j${NPROC} SYSDIR=/usr/src/sys" \
            2>&1 | tee /tmp/linux-virtio-build.log
          cp /tmp/drm-kmod/linuxkpi_virtio/linux_virtio.ko /tmp/ko-out/ 2>/dev/null || true

      - name: Summarize virtio shim build gaps
        if: always()
        run: |
          if [ -f /tmp/drm-kmod/linuxkpi_virtio/linux_virtio.ko ]; then
            echo "VIRTIO-SHIM-OK: linux_virtio.ko built (${{ matrix.target }})"
            ls -lh /tmp/drm-kmod/linuxkpi_virtio/linux_virtio.ko
            exit 0
          fi
          echo "VIRTIO-SHIM-INCOMPLETE (${{ matrix.target }}) — measured gaps follow"
          echo "=== missing headers ==="
          grep -oE "fatal error: '[^']+' file not found" /tmp/linux-virtio-build.log 2>/dev/null | sort -u || true
          echo "=== undeclared identifiers / implicit decls ==="
          grep -oE "(use of undeclared identifier|implicit declaration of function) '[^']+'" /tmp/linux-virtio-build.log 2>/dev/null | sort -u | head -60 || true
          echo "=== incomplete types ==="
          grep -oE "incomplete type '[^']+'" /tmp/linux-virtio-build.log 2>/dev/null | sort -u | head -30 || true
          echo "=== conflicting types (the tag-collision class) ==="
          grep -E "conflicting types|incompatible pointer type" /tmp/linux-virtio-build.log 2>/dev/null | head -20 || true
          echo "=== first 40 error lines ==="
          grep -E "error:" /tmp/linux-virtio-build.log 2>/dev/null | head -40 || true
          echo "=== error count ==="
          # ": error:" not "error:" -- a bare match also counts the grep
          # commands echoed into the log by `set -x`/step rendering, which
          # inflated every count in the first runs and made a clean driver
          # build read as 4 errors. Compiler diagnostics are always
          # file:line:col: error:.
          ERRS=$(grep -c ": error:" /tmp/linux-virtio-build.log 2>/dev/null) || ERRS=0
          echo "$ERRS"
          # Gate. On the REQUIRED_KOS list, a missing .ko is a build
          # failure rather than a measurement, and the gaps printed
          # above are the diagnosis rather than the deliverable.
          case " $REQUIRED_KOS " in
            *" linux_virtio "*)
              echo "::error::linux_virtio.ko did not build ($ERRS compiler errors) -- see the gaps above"
              exit 1 ;;
          esac

      # EXPERIMENTAL (graphics kext series, step 6): the shmem GEM helpers.
      #
      # drm_gem_shmem_helper.c is not in drm-kmod in any form, and
      # drm_fbdev_shmem.c is present but compiled by nothing there. Six drivers
      # want this layer (virtio-gpu, Hyper-V, ast, mgag200, cirrus, simpledrm),
      # so it is built once as its own module.
      #
      # Its own module rather than added to drm_extra_helpers on purpose: that
      # one is required by the boot test (BochsGraphics resolves through
      # IOGraphicsExtras), so an error in this unproven code must not be able to
      # take the working driver down with it.
      # EXPERIMENTAL (graphics kext series): the contiguous-DMA GEM layer, for
      # the Raspberry Pi display path (nextbsd-kernel#176). Separate module and
      # separate step from the other two helpers on purpose -- drm_extra_helpers
      # is load-bearing for the boot test via IOGraphicsExtras, so a compile
      # error in new code must not be able to take it down.
      #
      # continue-on-error, like its siblings: this is a build-gap probe first
      # and a deliverable second. A failure here should surface in the summary
      # below rather than fail the whole graphics job.
      - name: Build drm_dma_helpers.ko (contiguous-DMA GEM)
        continue-on-error: true
        run: |
          set -eu
          cp nbkm-tools/graphics/drivers/gpu/drm/*.c /tmp/drm-kmod/drivers/gpu/drm/
          cp nbkm-tools/graphics/include/drm/*.h     /tmp/drm-kmod/include/drm/
          cp -R nbkm-tools/graphics/drm_dma_helpers /tmp/drm-kmod/
          NPROC=$(nproc)
          cd /usr/src
          ./tools/build/make.py \
            --cross-bindir="${CROSS_BINDIR}" \
            TARGET=${{ matrix.target }} TARGET_ARCH=${{ matrix.target_arch }} KERNCONF=NEXTBSD \
            buildenv BUILDENV_SHELL="make -C /tmp/drm-kmod/drm_dma_helpers -j${NPROC} SYSDIR=/usr/src/sys" \
            2>&1 | tee /tmp/dma-helpers-build.log
          cp /tmp/drm-kmod/drm_dma_helpers/drm_dma_helpers.ko /tmp/ko-out/ 2>/dev/null || true

      - name: Summarize DMA helper build gaps
        # if: always(), NOT continue-on-error -- this step carries the gate, and
        # continue-on-error would swallow its exit 1 exactly the way it swallowed
        # the compile failures this module spent two runs hiding. Matches the
        # other five summarize steps.
        if: always()
        run: |
          set +e
          echo "=== drm_dma_helpers.ko ==="
          if [ -f /tmp/drm-kmod/drm_dma_helpers/drm_dma_helpers.ko ]; then
            echo "BUILT"
            ls -la /tmp/drm-kmod/drm_dma_helpers/drm_dma_helpers.ko
          else
            echo "NOT BUILT -- first errors:"
            grep -E "error:|fatal error:" /tmp/dma-helpers-build.log 2>/dev/null | head -30
            echo "--- missing headers, if any ---"
            grep -oE "'[a-z0-9_/.-]+\.h' file not found" /tmp/dma-helpers-build.log 2>/dev/null | sort -u | head -20
          fi
          # Gate, same as the other required modules. drm_dma_helpers builds as
          # of nextbsd-kernel#181 + #182, so a missing .ko is now a regression
          # rather than a measurement.
          case " $REQUIRED_KOS " in
            *" drm_dma_helpers "*)
              if [ ! -f /tmp/drm-kmod/drm_dma_helpers/drm_dma_helpers.ko ]; then
                echo "::error::drm_dma_helpers.ko did not build -- see the errors above"
                exit 1
              fi ;;
          esac

      # vc4_firmware_kms, vendored from raspberrypi/linux rpi-6.12.y and built
      # against the linuxkpi platform/OF/component work in nextbsd-kernel#183
      # and #184 (nextbsd-kernel#176).
      #
      # It began as a compile probe, to make the compiler enumerate the gaps
      # rather than guessing at a 53-symbol DRM surface from outside. The DRM
      # surface turned out to be complete; every gap was device-model. It now
      # builds, so it is in REQUIRED_KOS and the summarize step gates.
      #
      # The gap-category output below stays: it is what turned each failing
      # round into a specific list rather than a wall of errors, and it costs
      # nothing on a green build.
      - name: Build bcm_dvp.ko (DVP clocks and resets, #51)
        # hdmi@7ef00700 takes "resets = <&dvp 1>" and nothing could satisfy it,
        # so the HDMI block stayed in reset: register writes accepted, never
        # ready, "Failed to wait for infoframe to go idle: -60", no signal.
        #
        # continue-on-error while it is brought up on hardware, so a failure
        # cannot stop the vc4_kms steps from producing a testable kext.
        if: matrix.target == 'arm64'
        # proven on hardware: a failure here is a real regression
        run: |
          set -e
          mkdir -p /tmp/drm-kmod
          cp -R nbkm-tools/graphics/bcm_dvp /tmp/drm-kmod/
          NPROC=$(nproc)
          cd /usr/src
          ./tools/build/make.py \
            --cross-bindir="${CROSS_BINDIR}" \
            TARGET=${{ matrix.target }} TARGET_ARCH=${{ matrix.target_arch }} KERNCONF=NEXTBSD \
            buildenv BUILDENV_SHELL="make -C /tmp/drm-kmod/bcm_dvp -j${NPROC} SYSDIR=/usr/src/sys" \
            > /tmp/dvp-build.log 2>&1 || true
          # Append to the probe log, which IS uploaded as an artifact. The job
          # log is not readable until the whole run completes, so a failure here
          # was otherwise invisible for as long as the slowest leg took.
          { echo "=== bcm_dvp build ==="; cat /tmp/dvp-build.log; } >> /tmp/vc4kms-probe.log 2>/dev/null || true
          grep -E "error:" /tmp/dvp-build.log | head -10 || true
          cp /tmp/drm-kmod/bcm_dvp/bcm_dvp.ko /tmp/ko-out/
          ls -l /tmp/ko-out/bcm_dvp.ko && echo "    *** bcm_dvp.ko BUILT ***"

      - name: Build rpi_fw_clocks.ko (firmware clock provider, #51)
        # Plain newbus/clkdev, nothing vendored. Provides the clocks that
        # /soc/firmware/clocks advertises and nothing implements -- without it
        # every clk_set_rate() in vc4_hdmi is a no-op on a NULL clock, the HDMI
        # PHY never gets a pixel clock, and the display stays dark even though
        # the modeset succeeds.
        #
        # continue-on-error while it is brought up on hardware, so a failure
        # cannot stop the vc4_kms steps below from producing a testable kext.
        # Flip to a hard failure once it has attached.
        if: matrix.target == 'arm64'
        # proven on hardware: a failure here is a real regression
        run: |
          set -e
          mkdir -p /tmp/drm-kmod
          cp -R nbkm-tools/graphics/rpi_fw_clocks /tmp/drm-kmod/
          NPROC=$(nproc)
          cd /usr/src
          ./tools/build/make.py \
            --cross-bindir="${CROSS_BINDIR}" \
            TARGET=${{ matrix.target }} TARGET_ARCH=${{ matrix.target_arch }} KERNCONF=NEXTBSD \
            buildenv BUILDENV_SHELL="make -C /tmp/drm-kmod/rpi_fw_clocks -j${NPROC} SYSDIR=/usr/src/sys"
          cp /tmp/drm-kmod/rpi_fw_clocks/rpi_fw_clocks.ko /tmp/ko-out/
          ls -l /tmp/ko-out/rpi_fw_clocks.ko && echo "    *** rpi_fw_clocks.ko BUILT ***"

      - name: Build vc4_kms.ko (full KMS display pipeline, #51)
        # Still continue-on-error: the port is incomplete and this is expected
        # to fail for now. The gap summary below is what makes the failure
        # useful -- it reports what is still missing rather than just a red X.
        #
        # Flip this to a hard failure once it links, so a regression is caught
        # instead of being absorbed by continue-on-error.
        if: matrix.target == 'arm64'
        continue-on-error: true
        run: |
          set +e
          mkdir -p /tmp/drm-kmod/drivers/gpu/drm/vc4 /tmp/drm-kmod/include/soc/bcm2835 \
                   /tmp/drm-kmod/include/uapi/drm /tmp/drm-kmod/include/kunit \
                   /tmp/drm-kmod/include/linux/gpio /tmp/drm-kmod/include/sound
          cp nbkm-tools/graphics/drivers/gpu/drm/vc4/*   /tmp/drm-kmod/drivers/gpu/drm/vc4/
          cp nbkm-tools/graphics/include/linux/*.h       /tmp/drm-kmod/include/linux/
          cp nbkm-tools/graphics/include/soc/bcm2835/*.h /tmp/drm-kmod/include/soc/bcm2835/
          cp nbkm-tools/graphics/include/uapi/drm/*.h    /tmp/drm-kmod/include/uapi/drm/
          # New subdirectories for #51: the glob above is linux/*.h only, so
          # these would silently not arrive and the files would keep aborting.
          cp nbkm-tools/graphics/include/kunit/*.h       /tmp/drm-kmod/include/kunit/
          cp nbkm-tools/graphics/include/linux/gpio/*.h  /tmp/drm-kmod/include/linux/gpio/
          cp nbkm-tools/graphics/include/sound/*.h       /tmp/drm-kmod/include/sound/
          cp nbkm-tools/graphics/include/drm/*.h         /tmp/drm-kmod/include/drm/ 2>/dev/null || true
          # graphics/lkpi is the private LinuxKPI shared by the vc4 modules.
          # Their Makefiles add -I${.CURDIR:H}/lkpi, and graphics/ is copied
          # FLAT into /tmp/drm-kmod, so that resolves to /tmp/drm-kmod/lkpi --
          # it has to be copied too. The build uses -Werror,-Wmissing-include-dirs,
          # so a missing -I is a hard error, not a warning.
          [ -d /tmp/drm-kmod/lkpi ] || cp -R nbkm-tools/graphics/lkpi /tmp/drm-kmod/
          cp -R nbkm-tools/graphics/vc4_kms /tmp/drm-kmod/
          NPROC=$(nproc)
          cd /usr/src
          ./tools/build/make.py \
            --cross-bindir="${CROSS_BINDIR}" \
            TARGET=${{ matrix.target }} TARGET_ARCH=${{ matrix.target_arch }} KERNCONF=NEXTBSD \
            buildenv BUILDENV_SHELL="make -k -C /tmp/drm-kmod/vc4_kms -j${NPROC} SYSDIR=/usr/src/sys" \
            > /tmp/vc4kms-probe.log 2>&1
          echo "build exit: $?"
          exit 0

      - name: PROBE vc4_kms gap summary (#51)
        if: matrix.target == 'arm64'
        continue-on-error: true
        run: |
          set +e
          L=/tmp/vc4kms-probe.log
          [ -f "$L" ] || { echo "no probe log"; exit 0; }
          echo "=== did it LINK? (the real question now the shims exist)"
          # Stage it for packaging. Without this the
          # module builds and is then thrown away, which is why it appeared in
          # neither graphics-kexts-*.tar.gz nor nextbsd-modules-*.tar.gz and
          # could not be tested on hardware at all.
          cp /tmp/drm-kmod/vc4_kms/vc4_kms.ko /tmp/ko-out/ 2>/dev/null || true
          ls -l /tmp/drm-kmod/vc4_kms/vc4_kms.ko 2>/dev/null \
            && echo "    *** vc4_kms.ko BUILT ***" \
            || echo "    no vc4_kms.ko -- still incomplete, gaps below"
          echo
          echo "===================== TOTALS ====================="
          printf "  errors:            %s\n" "$(grep -c 'error:' $L)"
          printf "  missing headers:   %s\n" "$(grep -c 'file not found' $L)"
          printf "  implicit decls:    %s\n" "$(grep -c 'call to undeclared function' $L)"
          printf "  incomplete types:  %s\n" "$(grep -c 'incomplete type' $L)"
          printf "  no member named:   %s\n" "$(grep -c 'no member named' $L)"
          echo
          echo "============== MISSING HEADERS (unique) =============="
          grep -o \"'[^']*' file not found\" $L | sort -u | head -40
          echo
          echo "======== UNDECLARED FUNCTIONS (unique, the real surface) ========"
          grep -o "call to undeclared function '[^']*'" $L | sed "s/.*'\(.*\)'/\1/" | sort -u | head -80
          echo
          echo "============== NO MEMBER NAMED (unique) =============="
          grep -o "no member named '[^']*' in '[^']*'" $L | sort -u | head -40
          echo
          echo "===== COVERAGE: .o targets attempted (must be all 10) ====="
          grep -o "^--- [a-z0-9_]*\.o ---" $L | sort -u
          echo
          echo "============== FIRST 60 RAW ERRORS =============="
          grep 'error:' $L | head -60
          exit 0

      - name: Upload vc4_kms probe log (#51)
        if: matrix.target == 'arm64'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: vc4-kms-probe-log
          path: /tmp/vc4kms-probe.log
          if-no-files-found: ignore

      - name: Build bcm2712_pm.ko (V3D reset line, #66)
        # v3d@2000000 takes "resets = <&pm 0>" and nothing could satisfy it.
        # That is not cosmetic: v3d's probe falls back to mapping a "bridge"
        # register bank when the reset does not resolve, and a 2712 device tree
        # has no such bank, so probe fails outright.
        if: matrix.target == 'arm64'
        run: |
          set -e
          mkdir -p /tmp/drm-kmod
          cp -R nbkm-tools/graphics/bcm2712_pm /tmp/drm-kmod/
          NPROC=$(nproc)
          cd /usr/src
          ./tools/build/make.py \
            --cross-bindir="${CROSS_BINDIR}" \
            TARGET=${{ matrix.target }} TARGET_ARCH=${{ matrix.target_arch }} KERNCONF=NEXTBSD \
            buildenv BUILDENV_SHELL="make -C /tmp/drm-kmod/bcm2712_pm -j${NPROC} SYSDIR=/usr/src/sys" \
            > /tmp/pm-build.log 2>&1 || true
          { echo "=== bcm2712_pm build ==="; cat /tmp/pm-build.log; } >> /tmp/v3d-probe.log 2>/dev/null || true
          grep -E "error:" /tmp/pm-build.log | head -10 || true
          cp /tmp/drm-kmod/bcm2712_pm/bcm2712_pm.ko /tmp/ko-out/ 2>/dev/null || true
          test -f /tmp/ko-out/bcm2712_pm.ko

      - name: Build v3d.ko (BCM2712 GPU, #66)
        # No longer a probe. It builds, links, loads and registers a render
        # node on a Pi 500+, so a missing v3d.ko is a regression rather than a
        # measurement -- the gate below is what catches that. The gap summary
        # stays because it is what makes a failure diagnosable.
        #
        # arm64 only -- this is a BCM2712 part.
        if: matrix.target == 'arm64'
        run: |
          set +e
          mkdir -p /tmp/drm-kmod/drivers/gpu/drm/v3d
          cp nbkm-tools/graphics/drivers/gpu/drm/v3d/* /tmp/drm-kmod/drivers/gpu/drm/v3d/
          # The header copies the vc4_kms step does are NOT repeated: that step
          # runs earlier in the same job and has already populated
          # /tmp/drm-kmod/include, and graphics/lkpi is copied there too. Only
          # the uapi header is re-copied, because v3d_drm.h is new and the vc4
          # step's glob ran before it existed in the checkout.
          cp nbkm-tools/graphics/include/uapi/drm/*.h /tmp/drm-kmod/include/uapi/drm/
          [ -d /tmp/drm-kmod/lkpi ] || cp -R nbkm-tools/graphics/lkpi /tmp/drm-kmod/
          cp -R nbkm-tools/graphics/v3d /tmp/drm-kmod/
          NPROC=$(nproc)
          cd /usr/src
          ./tools/build/make.py \
            --cross-bindir="${CROSS_BINDIR}" \
            TARGET=${{ matrix.target }} TARGET_ARCH=${{ matrix.target_arch }} KERNCONF=NEXTBSD \
            buildenv BUILDENV_SHELL="make -k -C /tmp/drm-kmod/v3d -j${NPROC} SYSDIR=/usr/src/sys" \
            > /tmp/v3d-probe.log 2>&1
          echo "build exit: $?"
          cp /tmp/drm-kmod/v3d/v3d.ko /tmp/ko-out/ 2>/dev/null || true
          # The gate. Deliberately after the copy, so the artifact still carries
          # whatever was produced, and after `set +e`, so the gap summary below
          # runs and says WHY rather than the job dying on a bare exit code.
          test -f /tmp/ko-out/v3d.ko

      - name: PROBE v3d gap summary (#66)
        # always(): the build step above gates on a missing v3d.ko, and without
        # this the summary + log upload were skipped on exactly the runs that
        # need them (run 35594297879 failed with nothing but `build exit: 1`).
        if: always() && matrix.target == 'arm64'
        continue-on-error: true
        run: |
          set +e
          L=/tmp/v3d-probe.log
          [ -f "$L" ] || { echo "no probe log"; exit 0; }
          echo "=== did it LINK?"
          if [ -f /tmp/drm-kmod/v3d/v3d.ko ]; then
            echo "V3D-OK: v3d.ko built"
            ls -lh /tmp/drm-kmod/v3d/v3d.ko
          else
            echo "V3D-INCOMPLETE -- measured gaps follow (this is the deliverable)"
          fi
          echo "=== missing headers ==="
          grep -oE "fatal error: '[^']+' file not found" "$L" | sort -u
          echo "=== undeclared identifiers / implicit decls ==="
          grep -oE "(use of undeclared identifier|implicit declaration of function) '[^']+'" "$L" | sort -u | head -60
          echo "=== incomplete types ==="
          grep -oE "incomplete type '[^']+'" "$L" | sort -u | head -30
          echo "=== undefined symbols at link ==="
          grep -oE "undefined (reference to |symbol: )[^ ]+" "$L" | sort -u | head -40
          # BOTH spellings. A missing header is reported as ": fatal error:",
          # which ": error:" does not match -- so a run whose every file died
          # at the first #include counted zero errors and read as success.
          echo "=== error count ==="
          grep -cE ': (fatal )?error:' "$L"
          echo "============== FIRST 60 RAW ERRORS =============="
          grep -E ': (fatal )?error:' "$L" | head -60
          exit 0

      - name: Upload v3d probe log (#66)
        if: always() && matrix.target == 'arm64'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: v3d-probe-log
          path: /tmp/v3d-probe.log
          if-no-files-found: ignore

      # A dedicated upload, because "Upload drm-kmod modules artifact" runs
      # several steps earlier -- before this module is built -- so copying into
      # ko-out does NOT put it in that artifact. Checked by downloading it.
      - name: Build drm_shmem_helpers.ko (shmem GEM + fbdev)
        continue-on-error: true
        run: |
          set -eu
          cp nbkm-tools/graphics/drivers/gpu/drm/*.c /tmp/drm-kmod/drivers/gpu/drm/
          cp nbkm-tools/graphics/include/drm/*.h     /tmp/drm-kmod/include/drm/
          cp -R nbkm-tools/graphics/drm_shmem_helpers /tmp/drm-kmod/
          NPROC=$(nproc)
          cd /usr/src
          ./tools/build/make.py \
            --cross-bindir="${CROSS_BINDIR}" \
            TARGET=${{ matrix.target }} TARGET_ARCH=${{ matrix.target_arch }} KERNCONF=NEXTBSD \
            buildenv BUILDENV_SHELL="make -C /tmp/drm-kmod/drm_shmem_helpers -j${NPROC} SYSDIR=/usr/src/sys" \
            2>&1 | tee /tmp/shmem-helpers-build.log
          cp /tmp/drm-kmod/drm_shmem_helpers/drm_shmem_helpers.ko /tmp/ko-out/ 2>/dev/null || true

      - name: Summarize shmem helper build gaps
        if: always()
        run: |
          if [ -f /tmp/drm-kmod/drm_shmem_helpers/drm_shmem_helpers.ko ]; then
            echo "SHMEM-OK: drm_shmem_helpers.ko built (${{ matrix.target }})"
            ls -lh /tmp/drm-kmod/drm_shmem_helpers/drm_shmem_helpers.ko
            exit 0
          fi
          echo "SHMEM-INCOMPLETE (${{ matrix.target }}) — measured gaps follow"
          echo "=== missing headers ==="
          grep -oE "fatal error: '[^']+' file not found" /tmp/shmem-helpers-build.log 2>/dev/null | sort -u || true
          echo "=== undeclared identifiers / implicit decls ==="
          grep -oE "(use of undeclared identifier|implicit declaration of function) '[^']+'" /tmp/shmem-helpers-build.log 2>/dev/null | sort -u | head -60 || true
          echo "=== incomplete types ==="
          grep -oE "incomplete type '[^']+'" /tmp/shmem-helpers-build.log 2>/dev/null | sort -u | head -30 || true
          echo "=== first 40 error lines ==="
          grep -E "error:" /tmp/shmem-helpers-build.log 2>/dev/null | head -40 || true
          echo "=== error count ==="
          # ": error:" not "error:" -- a bare match also counts the grep
          # commands echoed into the log by `set -x`/step rendering, which
          # inflated every count in the first runs and made a clean driver
          # build read as 4 errors. Compiler diagnostics are always
          # file:line:col: error:.
          ERRS=$(grep -c ": error:" /tmp/shmem-helpers-build.log 2>/dev/null) || ERRS=0
          echo "$ERRS"
          # Gate. On the REQUIRED_KOS list, a missing .ko is a build
          # failure rather than a measurement, and the gaps printed
          # above are the diagnosis rather than the deliverable.
          case " $REQUIRED_KOS " in
            *" drm_shmem_helpers "*)
              echo "::error::drm_shmem_helpers.ko did not build ($ERRS compiler errors) -- see the gaps above"
              exit 1 ;;
          esac

      # EXPERIMENTAL (graphics kext series, step 7): the driver itself.
      #
      # ~5,100 lines vendored from Linux v6.12, MIT-licensed apart from
      # virtgpu_vram.c, which is not built (blob resources need a get_shm_region
      # bus method FreeBSD's virtio bus does not implement).
      #
      # Depends on all three companion modules: linux_virtio.ko, the shmem
      # helpers above, and drm_extra_helpers.ko for drm_simple_encoder_init and
      # drm_gem_fb_create_handle. Runs even when any of them fails, because the
      # separate failure sets are what these steps exist to measure and
      # serializing them wastes a CI cycle.
      - name: Build virtio_gpu_drm.ko (vendored Linux 6.12 virtio/)
        continue-on-error: true
        run: |
          set -eu
          mkdir -p /tmp/drm-kmod/drivers/gpu/drm/virtio
          cp nbkm-tools/graphics/drivers/gpu/drm/virtio/* /tmp/drm-kmod/drivers/gpu/drm/virtio/
          cp -R nbkm-tools/graphics/virtio_gpu_drm /tmp/drm-kmod/
          NPROC=$(nproc)
          cd /usr/src
          ./tools/build/make.py \
            --cross-bindir="${CROSS_BINDIR}" \
            TARGET=${{ matrix.target }} TARGET_ARCH=${{ matrix.target_arch }} KERNCONF=NEXTBSD \
            buildenv BUILDENV_SHELL="make -C /tmp/drm-kmod/virtio_gpu_drm -j${NPROC} SYSDIR=/usr/src/sys" \
            2>&1 | tee /tmp/virtio-gpu-build.log
          cp /tmp/drm-kmod/virtio_gpu_drm/virtio_gpu_drm.ko /tmp/ko-out/ 2>/dev/null || true

      - name: Summarize virtio-gpu build gaps
        if: always()
        run: |
          if [ -f /tmp/drm-kmod/virtio_gpu_drm/virtio_gpu_drm.ko ]; then
            echo "VIRTIO-GPU-OK: virtio_gpu_drm.ko built (${{ matrix.target }})"
            ls -lh /tmp/drm-kmod/virtio_gpu_drm/virtio_gpu_drm.ko
            exit 0
          fi
          echo "VIRTIO-GPU-INCOMPLETE (${{ matrix.target }}) — measured gaps follow"
          echo "=== missing headers ==="
          grep -oE "fatal error: '[^']+' file not found" /tmp/virtio-gpu-build.log 2>/dev/null | sort -u || true
          echo "=== undeclared identifiers / implicit decls ==="
          grep -oE "(use of undeclared identifier|implicit declaration of function) '[^']+'" /tmp/virtio-gpu-build.log 2>/dev/null | sort -u | head -80 || true
          echo "=== incomplete types ==="
          grep -oE "incomplete type '[^']+'" /tmp/virtio-gpu-build.log 2>/dev/null | sort -u | head -30 || true
          echo "=== undefined symbols at link ==="
          grep -oE "undefined symbol: [A-Za-z0-9_]+" /tmp/virtio-gpu-build.log 2>/dev/null | sort -u | head -40 || true
          echo "=== per-file error counts (which layer is the cost) ==="
          grep -oE "virtgpu_[a-z_]+\.c" /tmp/virtio-gpu-build.log 2>/dev/null | sort | uniq -c | sort -rn | head -20 || true
          echo "=== first 40 error lines ==="
          grep -E "error:" /tmp/virtio-gpu-build.log 2>/dev/null | head -40 || true
          echo "=== error count ==="
          # ": error:" not "error:" -- a bare match also counts the grep
          # commands echoed into the log by `set -x`/step rendering, which
          # inflated every count in the first runs and made a clean driver
          # build read as 4 errors. Compiler diagnostics are always
          # file:line:col: error:.
          ERRS=$(grep -c ": error:" /tmp/virtio-gpu-build.log 2>/dev/null) || ERRS=0
          echo "$ERRS"
          # Gate. On the REQUIRED_KOS list, a missing .ko is a build
          # failure rather than a measurement, and the gaps printed
          # above are the diagnosis rather than the deliverable.
          case " $REQUIRED_KOS " in
            *" virtio_gpu_drm "*)
              echo "::error::virtio_gpu_drm.ko did not build ($ERRS compiler errors) -- see the gaps above"
              exit 1 ;;
          esac

      - name: Generate graphics IOKitPersonalities from drm-kmod source
        run: |
          set -eu
          T=nbkm-tools/tools
          chmod +x "$T"/gen-i915-personalities.sh "$T"/gen-amdgpu-personalities.sh "$T"/gen-radeon-personalities.sh
          mkdir -p pers
          # Locate the id tables in the drm-kmod checkout (paths can drift across
          # drm versions, so find them rather than hardcode).
          I915H=$(find /tmp/drm-kmod -path '*drm/intel/i915_pciids.h' | head -1)
          I915C=$(find /tmp/drm-kmod -path '*gpu/drm/i915/i915_pci.c'  | head -1)
          AMDC=$(find /tmp/drm-kmod -path '*amd/amdgpu/amdgpu_drv.c' | head -1)
          DRMP=$(find /tmp/drm-kmod -name drm_pciids.h | head -1)
          # Every matched-GPU kext is amd64-only. arm64 ships the DRM core and
          # helpers only -- the drivers that would use these id tables either
          # cannot load there (amdgpu) or serve hardware an ARM VM does not have
          # (radeon: a discrete card in a physical PCIe slot). Generating them
          # would produce match tables for kexts that are never packaged.
          if [ "${{ matrix.target }}" != "amd64" ]; then
            echo "==> ${{ matrix.target }}: no vendor-GPU personalities (core + helpers only)"
          else
          test -f "$AMDC"  || { echo "amdgpu_drv.c not found in drm-kmod" >&2; exit 1; }
          test -f "$DRMP"  || { echo "drm_pciids.h not found in drm-kmod" >&2; exit 1; }
          # i915 is amd64-only: drm-kmod adds it to DEFAULT_KMODS for amd64/i386
          # only, so on arm64 there is no i915kms.ko to carry these ids and
          # generating them would produce a kext matching hardware that
          # architecture does not have.
          if [ "${{ matrix.target }}" = "amd64" ]; then
            test -f "$I915H" || { echo "i915_pciids.h not found in drm-kmod" >&2; exit 1; }
            test -f "$I915C" || { echo "i915_pci.c not found in drm-kmod" >&2; exit 1; }
            # 6.12 (#337): i915 ids come from the driver's pciidlist[] in i915_pci.c,
            # preprocessor-expanded via the header (the flat INTEL_VGA_DEVICE(0x..)
            # literals are gone). gen-i915 now takes both files.
            "$T/gen-i915-personalities.sh"   "$I915H" "$I915C" org.nextbsd.kext.intelgraphics IntelGraphics  > pers/IntelGraphics.iokitpersonalities
            # Count-band gate: pciidlist expansion yields ~364 ids on 6.12-lts. An
            # empty/tiny table means the extraction silently broke on a header change.
            NIG=$(grep -oE '0x[0-9a-f]{8}' pers/IntelGraphics.iokitpersonalities | sort -u | wc -l | tr -d ' ')
            [ "$NIG" -ge 300 ] && [ "$NIG" -le 450 ] || { echo "i915 id count $NIG out of band [300,450] — pciidlist extraction likely broke" >&2; exit 1; }
          fi
          "$T/gen-amdgpu-personalities.sh" "$AMDC"  org.nextbsd.kext.amdgraphics   AMDGraphics    > pers/AMDGraphics.iokitpersonalities
          # De-overlap: radeon yields SI/CIK to amdgpu (this build compiles amdgpu
          # WITH CONFIG_DRM_AMDGPU_SI/_CIK), so feed amdgpu's match words to -x.
          # The -x de-overlap exists because amdgpu CLAIMS the SI/CIK ids on this
          # build (it compiles with CONFIG_DRM_AMDGPU_SI/_CIK), so radeon must
          # not also claim them. Both kexts are amd64-only, so this whole
          # pairing is too -- see the wrap step for why arm64 ships neither.
          grep -oE '0x[0-9a-f]{8}' pers/AMDGraphics.iokitpersonalities | sort -u > pers/amdgpu-match.txt
          "$T/gen-radeon-personalities.sh" -x pers/amdgpu-match.txt "$DRMP" org.nextbsd.kext.radeongraphics RadeonGraphics > pers/RadeonGraphics.iokitpersonalities
          # bochs (graphics kext series): ids come from the vendored driver's own
          # bochs_pci_tbl[]. Skipped silently when the experimental build did not
          # produce a .ko, so this step stays green while that is iterated.
          if [ -f /tmp/ko-out/bochs.ko ]; then
            chmod +x "$T/gen-bochs-personalities.sh"
            "$T/gen-bochs-personalities.sh" /tmp/drm-kmod/drivers/gpu/drm/tiny/bochs.c \
                org.nextbsd.kext.bochsgraphics BochsGraphics > pers/BochsGraphics.iokitpersonalities
          fi
          # vboxvideo: same treatment, ids from its own pciidlist[] (80ee:beef).
          if [ -f /tmp/ko-out/vboxvideo.ko ]; then
            chmod +x "$T/gen-vboxvideo-personalities.sh"
            "$T/gen-vboxvideo-personalities.sh" /tmp/drm-kmod/drivers/gpu/drm/vboxvideo/vbox_drv.c \
                org.nextbsd.kext.vboxgraphics VBoxGraphics > pers/VBoxGraphics.iokitpersonalities
          fi
          fi
          # virtio-gpu: generated on BOTH arches, which is why it sits outside
          # the amd64-only block above. It is also the only generator here whose
          # input is a header rather than a driver's pci table -- virtio-gpu
          # matches by virtio device TYPE and the PCI id is derived from it.
          # See tools/gen-virtio-gpu-personalities.sh.
          if [ -f /tmp/ko-out/virtio_gpu_drm.ko ]; then
            chmod +x "$T/gen-virtio-gpu-personalities.sh"
            "$T/gen-virtio-gpu-personalities.sh" nbkm-tools/graphics/include/linux/virtio_ids.h \
                org.nextbsd.kext.virtiographics VirtIOGraphics > pers/VirtIOGraphics.iokitpersonalities
          fi
          # vc4 / BCM2712 (#65). These two are checked into the repo instead of
          # being generated, which is the opposite of every generator above, and
          # the reason is worth writing down.
          #
          # Those generators read the driver's own PCI id table, so the kext's
          # match table and the driver can never drift apart. An FDT personality
          # cannot be derived that way. The in-kernel matcher tests exactly ONE
          # string -- the FIRST entry of the device-tree node's "compatible" --
          # and that is a property of the board's DT, not of the driver. The gpu
          # node on a Pi 500+ reads
          #
          #     compatible = "brcm,bcm2712d0-vc6", "brcm,bcm2712-vc6";
          #
          # so the string the matcher sees is the d0 one, which appears nowhere
          # in vc4_drv.c: the driver matches the generic SECOND entry, because
          # ofw_bus_is_compatible() searches the whole list while the matcher
          # does not. A generator reading the driver would confidently emit a
          # personality that never matches the hardware it was generated for.
          # So the strings are checked in, and both spellings are listed.
          for src in graphics/vc4_kms/VideoCore6KMS graphics/bcm_dvp/BcmDVP graphics/v3d/V3D graphics/bcm2712_pm/BcmPM; do
            f="nbkm-tools/${src}.iokitpersonalities"
            [ -f "$f" ] && cp "$f" "pers/$(basename "$src").iokitpersonalities"
          done
          echo "=== device-id counts ==="
          for f in pers/IntelGraphics AMDGraphics RadeonGraphics; do : ; done
          for f in pers/*.iokitpersonalities; do
            n=$(grep -oE '0x[0-9a-f]{8}' "$f" | sort -u | wc -l | tr -d ' ')
            echo "  $(basename "$f"): ${n} ids"
          done

      - name: Wrap drm core + GPU drivers into kexts
        run: |
          set -eu
          K=nbkm-tools/tools/ko2kext.sh
          chmod +x "$K"
          O=kexts; mkdir -p "$O"
          KO=/tmp/ko-out
          # drm core family. Load order dmabuf -> drm -> ttm; linuxkpi is baked in
          # the kernel (like the iwlwifi kext), so it needs no OSBundleLibraries.
          "$K" -o "$O" "$KO/dmabuf.ko" DMABuf org.nextbsd.kext.dmabuf
          "$K" -o "$O" -l org.nextbsd.kext.dmabuf "$KO/drm.ko" IOGraphics org.nextbsd.kext.iographics
          "$K" -o "$O" -l org.nextbsd.kext.iographics "$KO/ttm.ko" TTM org.nextbsd.kext.ttm
          # Per-vendor GPU kexts: depend on the drm core, carry their own device-id
          # match table. (Firmware bundling — ko2kext -f — is the next step.)
          # IntelGraphics only where i915 exists (amd64); see the personalities
          # step. Guarded on the .ko rather than on matrix.target so the two
          # cannot drift apart.
          if [ -f "$KO/i915kms.ko" ]; then
            "$K" -o "$O" -l org.nextbsd.kext.iographics -l org.nextbsd.kext.ttm \
                 -p pers/IntelGraphics.iokitpersonalities \
                 "$KO/i915kms.ko" IntelGraphics org.nextbsd.kext.intelgraphics
          fi
          # arm64 ships the DRM core and helpers ONLY. Neither AMD kext is
          # packaged there, for two different reasons:
          #
          #   AMDGraphics     CANNOT work -- upstream drm-kmod cannot produce a
          #                   loadable amdgpu.ko on aarch64 (see below).
          #   RadeonGraphics  builds and resolves fine, but only ever matches a
          #                   discrete AMD card in a physical PCIe slot, which
          #                   is not what an ARM VM presents. Shipping it would
          #                   add a kext no arm64 target can use.
          #
          # The arm64 KMS story is a driver that binds what an ARM VM actually
          # has -- see nextbsd-arm64-kms-options.html.
          #
          # On the AMDGraphics side specifically, this is NOT by choice.
          # kconfig.mk gates
          # DRM_AMD_DC_FP behind `.if ${MACHINE_CPUARCH} == "amd64"`, which drops
          # the Display Core floating-point source block from amd/amdgpu/Makefile
          # -- but the references to those symbols are compiled unconditionally.
          # The result builds clean and then fails kldload with ENOEXEC on five
          # undefined symbols:
          #
          #   dal_hw_factory_dcn401_init      dal_hw_translate_dcn401_init
          #   dscl2_spl_calc_lb_num_partitions   dscl32_spl_calc_lb_num_partitions
          #   dscl401_spl_calc_lb_num_partitions
          #
          # Found by tools/check-kext-symbols.py on this job's first arm64 run.
          # Deleting this guard is the test for whether upstream has fixed it:
          # the symbol gate will fail the build again if not.
          #
          # radeonkms has no such gap -- it builds and resolves cleanly on
          # aarch64 -- but it is not packaged there either, for a separate
          # reason: it only ever matches a discrete AMD card in a physical PCIe
          # slot, which an ARM VM does not present. amd64 ships both kexts
          # exactly as before.
          if [ "${{ matrix.target }}" = "amd64" ]; then
            "$K" -o "$O" -l org.nextbsd.kext.iographics -l org.nextbsd.kext.ttm -l org.nextbsd.kext.dmabuf \
                 -p pers/AMDGraphics.iokitpersonalities \
                 "$KO/amdgpu.ko" AMDGraphics org.nextbsd.kext.amdgraphics
          else
            echo "==> AMDGraphics.kext SKIPPED on ${{ matrix.target }}: upstream amdgpu.ko is unloadable there (DRM_AMD_DC_FP is amd64-only)"
          fi
          if [ "${{ matrix.target }}" = "amd64" ]; then
            "$K" -o "$O" -l org.nextbsd.kext.iographics -l org.nextbsd.kext.ttm \
                 -p pers/RadeonGraphics.iokitpersonalities \
                 "$KO/radeonkms.ko" RadeonGraphics org.nextbsd.kext.radeongraphics
          else
            echo "==> RadeonGraphics.kext SKIPPED on ${{ matrix.target }}: matches only discrete PCIe cards, which an ARM VM does not present"
          fi
          # Graphics kext series: the shared helper module first (bochs depends
          # on it), then bochs itself with its device-match personalities.
          if [ -f "$KO/drm_extra_helpers.ko" ]; then
            "$K" -o "$O" -l org.nextbsd.kext.iographics -l org.nextbsd.kext.ttm \
                 "$KO/drm_extra_helpers.ko" IOGraphicsExtras org.nextbsd.kext.iographicsextras
          fi
          if [ -f "$KO/bochs.ko" ] && [ -f pers/BochsGraphics.iokitpersonalities ]; then
            "$K" -o "$O" -l org.nextbsd.kext.iographics -l org.nextbsd.kext.ttm \
                 -l org.nextbsd.kext.iographicsextras \
                 -p pers/BochsGraphics.iokitpersonalities \
                 "$KO/bochs.ko" BochsGraphics org.nextbsd.kext.bochsgraphics
          fi
          # vboxvideo: identical dependency shape to bochs -- both are VRAM-helper
          # drivers, so both link IOGraphicsExtras.
          if [ -f "$KO/vboxvideo.ko" ] && [ -f pers/VBoxGraphics.iokitpersonalities ]; then
            "$K" -o "$O" -l org.nextbsd.kext.iographics -l org.nextbsd.kext.ttm \
                 -l org.nextbsd.kext.iographicsextras \
                 -p pers/VBoxGraphics.iokitpersonalities \
                 "$KO/vboxvideo.ko" VBoxGraphics org.nextbsd.kext.vboxgraphics
          fi
          # virtio-gpu, on BOTH arches -- the only graphics driver here that is
          # not amd64-only, because it is the sole KMS candidate an arm64 VM
          # can present at all.
          #
          # Three bundles, because the two companion modules are shared layers
          # rather than parts of this driver: LinuxVirtIO is the virtio shim
          # (the next virtio driver ported here needs the same one) and
          # IOGraphicsShmem is the shmem GEM layer (ast, mgag200, cirrus,
          # Hyper-V and simpledrm all sit on it).
          #
          # Note the dependency shape differs from bochs/vboxvideo: NO TTM.
          # Those are VRAM-helper drivers whose buffers live in a device BAR;
          # virtio-gpu's live in swap-backed system memory, which is exactly
          # why it sidesteps the fictitious-range problem. Linking TTM here
          # would declare a dependency the driver does not have.
          if [ -f "$KO/linux_virtio.ko" ]; then
            "$K" -o "$O" -l org.nextbsd.kext.dmabuf \
                 "$KO/linux_virtio.ko" LinuxVirtIO org.nextbsd.kext.linuxvirtio
          fi
          if [ -f "$KO/drm_shmem_helpers.ko" ]; then
            "$K" -o "$O" -l org.nextbsd.kext.iographics -l org.nextbsd.kext.dmabuf \
                 "$KO/drm_shmem_helpers.ko" IOGraphicsShmem org.nextbsd.kext.iographicsshmem
          fi
          # IOGraphicsDMA is the contiguous-DMA GEM layer (nextbsd-kernel#176:
          # the Raspberry Pi display path). Wrapped here for the same reason as
          # the two above, and for one more: /tmp/ko-out is uploaded as an
          # artifact BEFORE any of the helper builds run, so a helper that is
          # never wrapped leaves no trace anywhere and its build result cannot
          # be observed at all. Same dependency shape as IOGraphicsShmem and for
          # the same reasons -- drm core plus dmabuf, and NO TTM, since these
          # buffers are contiguous system memory rather than a device BAR.
          if [ -f "$KO/drm_dma_helpers.ko" ]; then
            "$K" -o "$O" -l org.nextbsd.kext.iographics -l org.nextbsd.kext.dmabuf \
                 "$KO/drm_dma_helpers.ko" IOGraphicsDMA org.nextbsd.kext.iographicsdma
          fi
          # VideoCore6KMS -- the full VC4 KMS display pipeline for BCM2712
          # (#51). It programs the HVS, pixelvalves and HDMI PHY directly,
          # which is the only way to get hardware planes and therefore a
          # hardware cursor.
          #
          # This replaced firmware KMS, which could not program a plane at all
          # because the firmware does not service SET_PLANE (#48, measured) and
          # which is retired in #64. It is now the only display driver here, so
          # there is no longer a pair that must not both be loaded.
          #
          # Autoloads (#65). Its personality matches the gpu node's compatible,
          # and the two -l dependencies below are what fix the load ORDER that
          # matching alone cannot express: BcmDVP supplies the HDMI reset lines
          # and the 108MHz gates, RpiFirmwareClocks the clocks vc4_hdmi resolves
          # at attach. Attach first and it gets NULL clocks and no reset, and
          # the display stays dark while reporting no error. OSKextLoad() walks
          # OSBundleLibraries and loads them first, so naming them here is what
          # makes the order hold -- for kextd's autoload and kextload alike.
          #
          # arm64 only: this is a BCM2712 part.
          if [ -f "$KO/vc4_kms.ko" ] && [ -f pers/VideoCore6KMS.iokitpersonalities ]; then
            "$K" -o "$O" -l org.nextbsd.kext.iographics -l org.nextbsd.kext.dmabuf \
                 -l org.nextbsd.kext.iographicsdma \
                 -l org.nextbsd.kext.iographicsextras \
                 -l org.nextbsd.kext.bcmdvp \
                 -l org.nextbsd.kext.rpifirmwareclocks \
                 -p pers/VideoCore6KMS.iokitpersonalities \
                 "$KO/vc4_kms.ko" VideoCore6KMS org.nextbsd.kext.videocore6kms
          fi
          # RpiFirmwareClocks -- the provider for /soc/firmware/clocks (#51).
          # Not a graphics driver, but the vc4 display pipeline cannot produce
          # a signal without it: the HDMI state machine and pixel-bvb clocks
          # come from the firmware mailbox, and with no provider they resolve
          # to NULL and every rate set is silently dropped.
          #
          # Deliberately NO IOKitPersonalities, and it is the one kext here
          # that cannot have one. A personality only ever fires for a node no
          # driver claimed, and this node is claimed at boot: FreeBSD's generic
          # ofw_clkbus matches /soc/firmware/clocks on the node NAME alone and
          # is compiled into the kernel, so the node never goes unmatched and
          # the matcher never looks at it. It is pulled in as a dependency of
          # VideoCore6KMS instead, and takes the node back in its own
          # DEVICE_IDENTIFY -- see rpi_fw_clocks_identify().
          # BcmDVP -- display video path clocks and resets (#51). Provides the
          # reset line hdmi names in "resets = <&dvp 1>". Without it the HDMI
          # block never leaves reset and emits nothing.
          #
          # Autoloads on its own too -- unlike the clocks node, nothing in the
          # kernel claims clock@7c700000, so it goes unmatched and the matcher
          # sees it. VideoCore6KMS still names it as a dependency, which is
          # what guarantees it is attached BEFORE vc4_hdmi looks for resets.
          if [ -f "$KO/bcm_dvp.ko" ] && [ -f pers/BcmDVP.iokitpersonalities ]; then
            "$K" -o "$O" -p pers/BcmDVP.iokitpersonalities \
                 "$KO/bcm_dvp.ko" BcmDVP org.nextbsd.kext.bcmdvp
          fi
          if [ -f "$KO/rpi_fw_clocks.ko" ]; then
            "$K" -o "$O" "$KO/rpi_fw_clocks.ko" RpiFirmwareClocks org.nextbsd.kext.rpifirmwareclocks
          fi
          # V3D -- the BCM2712 GPU / render node (#66). Separate from the
          # display driver: on 2712 the 3D core is its own device, unlike
          # BCM2711 where "vc4" meant both.
          #
          # Depends on the DRM core for the SCHEDULER as much as for drm
          # itself -- drm_sched lives in IOGraphics.kext -- and on
          # IOGraphicsShmem for the shmem GEM its buffers are built on. NOT
          # TTM: v3d_bo.c is drm_gem_shmem_*, not VRAM helpers.
          #
          # Also depends on RpiFirmwareClocks, which supplies rpifw-v3d, and
          # names it as a library so it is attached before this probe reads
          # the clock rate.
          # BcmPM -- the V3D reset line (#66). Same shape as BcmDVP: a plain
          # newbus OFW reset provider, no LinuxKPI, no kext dependencies.
          if [ -f "$KO/bcm2712_pm.ko" ] && [ -f pers/BcmPM.iokitpersonalities ]; then
            "$K" -o "$O" -p pers/BcmPM.iokitpersonalities \
                 "$KO/bcm2712_pm.ko" BcmPM org.nextbsd.kext.bcmpm
          fi
          # The last -l is an ORDERING edge, not a symbol dependency, and it
          # fixes a bug that only appeared once this kext started shipping.
          #
          # A Pi 5 now has TWO DRM devices: vc4 (display) and v3d (render). DRM
          # hands out minors in attach order, so /dev/dri/card0 is whichever
          # driver won that boot -- and both autoload independently, so it is a
          # coin flip. Measured before this line: roughly half of boots came up
          # v3d=0 vc4=1.
          #
          # When v3d wins, Xorg takes card0 as the primary GPU, finds a
          # render-only device with no CRTCs and no outputs, and dies:
          #
          #	(II) modeset(G0): using drv /dev/dri/card1
          #	(EE) No devices detected.
          #	Fatal server error: no screens found
          #
          # LoginWindow then restarts it forever. Note the capital G: vc4 was
          # demoted to a secondary GPU device, leaving no primary screen.
          #
          # Naming VideoCore6KMS here makes OSKextLoad attach the display driver
          # first, so vc4 always takes minor 0. Verified on a Pi 500+: 11 of 11
          # boots came up vc4=0 v3d=1 with zero X crashes, six of them with the
          # xorg.conf.d workaround removed to prove this alone is sufficient.
          #
          # The alternative is an Xorg OutputClass with PrimaryGPU, which is what
          # Linux distros ship for hybrid graphics. That works too, but it papers
          # over a nondeterministic device tree rather than fixing it, and every
          # other consumer of card0 would still be rolling dice.
          if [ -f "$KO/v3d.ko" ] && [ -f pers/V3D.iokitpersonalities ]; then
            "$K" -o "$O" -l org.nextbsd.kext.iographics -l org.nextbsd.kext.dmabuf \
                 -l org.nextbsd.kext.iographicsshmem \
                 -l org.nextbsd.kext.rpifirmwareclocks \
                 -l org.nextbsd.kext.bcmpm \
                 -l org.nextbsd.kext.videocore6kms \
                 -p pers/V3D.iokitpersonalities \
                 "$KO/v3d.ko" V3D org.nextbsd.kext.v3d
          fi
          if [ -f "$KO/virtio_gpu_drm.ko" ] && [ -f pers/VirtIOGraphics.iokitpersonalities ]; then
            "$K" -o "$O" -l org.nextbsd.kext.iographics -l org.nextbsd.kext.dmabuf \
                 -l org.nextbsd.kext.iographicsextras \
                 -l org.nextbsd.kext.iographicsshmem \
                 -l org.nextbsd.kext.linuxvirtio \
                 -p pers/VirtIOGraphics.iokitpersonalities \
                 "$KO/virtio_gpu_drm.ko" VirtIOGraphics org.nextbsd.kext.virtiographics
          fi
          echo "=== built kexts ==="
          for d in "$O"/*.kext; do echo "  $(basename "$d") ($(du -sh "$d" | cut -f1))"; done

      # Catch the ENOEXEC class at BUILD time. A .ko links with undefined
      # symbols dangling and resolves them at kldload, so it can compile,
      # package and validate perfectly and still be dead on arrival. That is
      # not hypothetical: drm-kmod ships drm_format_helper.c but names it in no
      # Makefile, so adding the shadow-plane helpers (which embed a
      # drm_format_conv_state) produced an IOGraphicsExtras.kext that built
      # clean and then failed kldload with "Exec format error", taking
      # BochsGraphics down with it. One CI cycle to find, and the symbol name
      # was only in a dmesg dump the boot test exited before printing.
      - name: Check every kext resolves (no ENOEXEC at kldload)
        run: |
          set -eu
          KERN=$(find /usr/obj -type f -name kernel | head -1)
          test -n "$KERN" || { echo "kernel not found under /usr/obj" >&2; exit 1; }
          python3 nbkm-tools/tools/check-kext-symbols.py "$KERN" kexts

      - name: Validate graphics kext Info.plists + dependency chain
        run: |
          python3 - <<'PY'
          import plistlib
          # name -> (bundle-id, vendor-or-None, required OSBundleLibraries)
          checks = {
            'DMABuf':         ('org.nextbsd.kext.dmabuf', None, []),
            'IOGraphics':     ('org.nextbsd.kext.iographics', None, ['org.nextbsd.kext.dmabuf']),
            'TTM':            ('org.nextbsd.kext.ttm', None, ['org.nextbsd.kext.iographics']),
          }
          import os
          # IntelGraphics is amd64-only (drm-kmod builds i915 for amd64/i386
          # only), so it is checked exactly like the other optional kexts
          # rather than assumed present -- on the arm64 leg it does not exist.
          # AMDGraphics is absent on arm64 (see the wrap step: upstream amdgpu.ko
          # cannot load there), so it is checked only when it shipped.
          if os.path.exists('kexts/RadeonGraphics.kext'):
              checks['RadeonGraphics'] = ('org.nextbsd.kext.radeongraphics', '1002',
                                          ['org.nextbsd.kext.iographics','org.nextbsd.kext.ttm'])
          if os.path.exists('kexts/AMDGraphics.kext'):
              checks['AMDGraphics'] = ('org.nextbsd.kext.amdgraphics', '1002',
                                       ['org.nextbsd.kext.iographics','org.nextbsd.kext.ttm','org.nextbsd.kext.dmabuf'])
          if os.path.exists('kexts/IntelGraphics.kext'):
              checks['IntelGraphics'] = ('org.nextbsd.kext.intelgraphics', '8086',
                                         ['org.nextbsd.kext.iographics','org.nextbsd.kext.ttm'])
          # Graphics kext series. Guarded on existence so the gate stays green
          # while the experimental builds are iterated. IOGraphicsExtras carries
          # no personalities (it is a library other drivers link against);
          # BochsGraphics is checked below rather than through the `vendor`
          # rule, because it matches TWO vendors -- 1234:1111 (qemu stdvga /
          # bochs-display) and 4321:1111 (Simics) -- so no single vendor suffix
          # describes its id list.
          if os.path.exists('kexts/IOGraphicsExtras.kext'):
              checks['IOGraphicsExtras'] = ('org.nextbsd.kext.iographicsextras', None,
                                            ['org.nextbsd.kext.iographics','org.nextbsd.kext.ttm'])
          if os.path.exists('kexts/BochsGraphics.kext'):
              checks['BochsGraphics'] = ('org.nextbsd.kext.bochsgraphics', None,
                                         ['org.nextbsd.kext.iographics','org.nextbsd.kext.ttm',
                                          'org.nextbsd.kext.iographicsextras'])
          # VBoxGraphics DOES go through the `vendor` rule, unlike BochsGraphics:
          # its whole table is one Oracle id (80ee:beef), so the vendor suffix
          # describes it exactly.
          if os.path.exists('kexts/VBoxGraphics.kext'):
              checks['VBoxGraphics'] = ('org.nextbsd.kext.vboxgraphics', '80ee',
                                        ['org.nextbsd.kext.iographics','org.nextbsd.kext.ttm',
                                         'org.nextbsd.kext.iographicsextras'])
          # The virtio-gpu trio, present on both arches. Note the deps: no TTM,
          # because these are swap-backed rather than VRAM-backed, and asserting
          # the absence is as much the point as asserting the presence -- a
          # spurious TTM edge would be a dependency the driver does not have.
          if os.path.exists('kexts/LinuxVirtIO.kext'):
              checks['LinuxVirtIO'] = ('org.nextbsd.kext.linuxvirtio', None,
                                       ['org.nextbsd.kext.dmabuf'])
          if os.path.exists('kexts/IOGraphicsShmem.kext'):
              checks['IOGraphicsShmem'] = ('org.nextbsd.kext.iographicsshmem', None,
                                           ['org.nextbsd.kext.iographics','org.nextbsd.kext.dmabuf'])
          if os.path.exists('kexts/VirtIOGraphics.kext'):
              checks['VirtIOGraphics'] = ('org.nextbsd.kext.virtiographics', '1af4',
                                          ['org.nextbsd.kext.iographics','org.nextbsd.kext.dmabuf',
                                           'org.nextbsd.kext.iographicsextras',
                                           'org.nextbsd.kext.iographicsshmem',
                                           'org.nextbsd.kext.linuxvirtio'])
          def load(n):
              return plistlib.load(open(f'kexts/{n}.kext/Contents/Info.plist','rb'))
          for name,(bid,vendor,deps) in checks.items():
              d=load(name)
              assert d['CFBundleIdentifier']==bid, (name, d['CFBundleIdentifier'])
              # Every kext must declare OSBundleCompatibleVersion, or it can't be
              # used as a dependency target — OSKext rejects it ("lacks valid
              # OSBundleCompatibleVersion"), which blocks every dependent kext.
              assert d.get('OSBundleCompatibleVersion'), (name,'missing OSBundleCompatibleVersion')
              libs=d.get('OSBundleLibraries',{})
              for dep in deps: assert dep in libs, (name,'missing OSBundleLibraries dep',dep)
              if vendor:
                  per=d['IOKitPersonalities'][name]
                  assert per['IOProviderClass']=='IOPCIDevice', (name,per)
                  assert per['IOClass']==name, (name,per)
                  ids=per['IOPCIPrimaryMatch'].split()
                  assert ids and all(x.startswith('0x') and x.endswith(vendor) and len(x)==10 for x in ids), (name, ids[:3])

                  print(f"{name}: OK — {len(ids)} {vendor} ids, deps {deps}")
              else:
                  print(f"{name}: OK — drm-core, deps {deps}")
          # bochs: explicit id set. The qemu stdvga match is the one every CI
          # guest hits (q35's default -vga std IS stdvga), so assert it by name
          # rather than by shape.
          if 'BochsGraphics' in checks:
              per = load('BochsGraphics')['IOKitPersonalities']['BochsGraphics']
              assert per['IOProviderClass']=='IOPCIDevice', per
              assert per['IOClass']=='BochsGraphics', per
              ids = set(per['IOPCIPrimaryMatch'].split())
              assert '0x11111234' in ids, ('BochsGraphics: qemu stdvga id missing', ids)
              assert ids <= {'0x11111234','0x11114321'}, ('BochsGraphics: unexpected id', ids)
              print('  BochsGraphics personalities OK:', sorted(ids))

          # The matched GPU kexts must have DISJOINT device-id sets.
          def ids(n):
              return set(load(n)['IOKitPersonalities'][n]['IOPCIPrimaryMatch'].split())
          # Fold the virtual-GPU drivers into the same rule as they appear. Two
          # drivers claiming one id is the failure that makes a machine bind the
          # wrong driver, and it costs nothing to assert across the full set.
          # Build the list from what actually shipped: IntelGraphics is absent on
          # arm64, and the virtual-GPU kexts are amd64-only too.
          allmatched=[n for n in ('AMDGraphics','RadeonGraphics','IntelGraphics',
                                  'BochsGraphics','VBoxGraphics','VirtIOGraphics') if n in checks]
          pairs=[(a,b) for i,a in enumerate(allmatched) for b in allmatched[i+1:]]
          for a,b in pairs:
              o=ids(a)&ids(b)
              assert not o, f"{a}/{b} share device ids: {sorted(o)[:5]}"
          print(f"All GPU kext match sets pairwise disjoint ({len(allmatched)} kexts, {len(pairs)} pairs)")
          PY

      - name: Upload graphics kexts artifact
        uses: actions/upload-artifact@v4
        with:
          name: graphics-kexts-${{ matrix.target }}
          path: kexts/**

  # Prove the graphics-kext IOKitPersonalities generators (i915/amdgpu/radeon) on
  # every PR. The drm-kmod source build isn't wired yet, so this exercises the
  # parsers against synthetic PCI-id fixtures (same shapes as i915_pciids.h /
  # amdgpu_drv.c / drm_pciids.h) and asserts the emitted match table — including
  # that radeon EXCLUDES r128 (also vendor 0x1002). Lightweight (no module build
  # needed); the equivalent of how gen-em/gen-iwlwifi are proven by the module +
  # kext-smoke jobs. PR-only; publish stays gated to main.
  graphics-personalities-selftest:
    name: graphics personalities self-test (i915/amdgpu/radeon)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (tools/ + tests/)
        uses: actions/checkout@v4
      - name: Run i915/amdgpu/radeon personality generators against fixtures
        run: ./tests/personalities-selftest.sh

  # PR-only kext lane (nextbsd-ci#6, T6): prove the virtio-gpu graphics kext
  # stack is what kextd autoloads in a BOOTED NextBSD system, on both arches.
  # Same shape as nextbsd-userland's lane: the image is ASSEMBLED here from the
  # latest component `continuous` artifacts (base, kernel, userland, contrib)
  # plus this PR's own kext build, via the SHARED nextbsd-ci assembly (pinned
  # release tag) -- no freebsd-vm, no prebuilt-image mutation, no pkg. It is
  # then booted in the shared harness and asserted on the virtio-gpu trio.
  # The harness boots both arches with -device virtio-gpu-pci (nextbsd-ci
  # v0.3.0: alongside q35's default VGA on amd64, as the display on
  # virt/arm64), so the binding kext is VirtIOGraphics on BOTH lanes and the
  # on-image assertion is identical. PR-only, never publishes.
  kext-image:
    name: "kext image (assemble: continuous components + this PR's kexts)"
    needs: [drm-kmod]
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: amd64
            runner: ubuntu-24.04
          # arm64 assembles on an x86 runner too: the per-arch
          # kernel-toolchain images are x86_64 containers carrying an
          # aarch64 CROSS toolchain (the same image the userland lane uses),
          # so they cannot run -- or even pull -- on an ARM runner. Only the
          # kext-boot job below goes native-ARM (to KVM-boot the aarch64
          # image), exactly like the userland lane's split.
          - target: arm64
            runner: ubuntu-24.04
    timeout-minutes: 45
    container:
      # The shared assembly host-builds makefs/mkimg/pwd_mkdb/cap_mkdb from
      # /usr/src via the cross toolchain when they are not on PATH; the
      # kernel-toolchain image provides both (same image the userland lane
      # assembles in).
      image: ghcr.io/nextbsd/nextbsd-kernel-toolchain:${{ matrix.target }}-latest
    steps:
      - uses: actions/checkout@v4

      # The graphics stack this PR just built (drm-kmod job): kextd autoloads
      # whatever here matches a present device, and the machine shape presents
      # a virtio-gpu -- so VirtIOGraphics (resolving through LinuxVirtIO +
      # IOGraphicsShmem) is what the on-image test asserts.
      - name: Download this PR's graphics kexts
        uses: actions/download-artifact@v4
        with:
          name: graphics-kexts-${{ matrix.target }}
          path: gfx-dl

      - name: Fetch the latest component continuous artifacts + overlays seed
        env:
          # Public cross-repo reads (github.token, not a PAT) so fork PRs run.
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.target }}
        run: |
          set -eu
          mkdir -p art seed
          gh release download continuous -R nextbsd/nextbsd-freebsd-compat \
            --pattern "nextbsd-base-${ARCH}.tar.gz" --dir art --clobber
          gh release download continuous -R nextbsd/nextbsd-kernel \
            --pattern "nextbsd-kernel-${ARCH}.tar.gz" --dir art --clobber
          gh release download continuous -R nextbsd/nextbsd-userland \
            --pattern "nextbsd-userland-${ARCH}.tar.gz" --dir art --clobber
          # contrib (sudo/zsh/pico) is best-effort: a mid-flight rebuild of an
          # unrelated component must not gate the kext lane.
          gh release download continuous -R nextbsd/nextbsd-contrib \
            --pattern "nextbsd-contrib-${ARCH}.tar.gz" --dir art --clobber || true
          # pkg-free /etc seed (the API tarball needs no git in the container).
          gh api repos/nextbsd/nextbsd-overlays/tarball/main > /tmp/overlays.tar.gz
          tar -C seed --strip-components=1 -xzf /tmp/overlays.tar.gz
          # The PR's kext artifact is a directory tree; the shared assembly
          # takes tarballs, so re-tar from the kext root (kexts at top level,
          # matching the continuous graphics-kexts-<arch> layout).
          KDIR=$(dirname "$(find gfx-dl -maxdepth 3 -name '*.kext' -type d | head -1)")
          [ -n "$KDIR" ] || { echo "no kexts in the graphics artifact" >&2; find gfx-dl | head; exit 1; }
          tar -C "$KDIR" -czf "art/graphics-kexts-${ARCH}-pr.tar.gz" .
          echo "==> component artifacts:"; ls -lh art/

      - name: Checkout shared assembly + boot harness (nextbsd-ci, pinned)
        uses: actions/checkout@v4
        with:
          repository: nextbsd/nextbsd-ci
          ref: v0.3.5
          path: nextbsd-ci

      - name: Assemble the kext image (shared nextbsd-ci assembly)
        env:
          ARCH: ${{ matrix.target }}
          WORK: ${{ github.workspace }}/nbimg
          BASE_TGZ: ${{ github.workspace }}/art/nextbsd-base-${{ matrix.target }}.tar.gz
          KERNEL_TGZ: ${{ github.workspace }}/art/nextbsd-kernel-${{ matrix.target }}.tar.gz
          USERLAND_TGZ: ${{ github.workspace }}/art/nextbsd-userland-${{ matrix.target }}.tar.gz
          CONTRIB_TGZ: ${{ github.workspace }}/art/nextbsd-contrib-${{ matrix.target }}.tar.gz
          MODULES_TGZ: ${{ github.workspace }}/art/graphics-kexts-${{ matrix.target }}-pr.tar.gz
          SEED_ROOTFS: ${{ github.workspace }}/seed/rootfs
          EXTRA_ROOTFS: ${{ github.workspace }}/extra
        run: |
          set -eu
          # Bake the on-image kextstat test into the rootfs (EXTRA_ROOTFS
          # overlay): kextd autoloads the virtio-gpu kext at boot, so the test
          # is a plain kextstat check + the sentinel the harness reads.
          mkdir -p extra/usr/tests/nextbsd/kext
          cp tests/kext-on-image-run.sh extra/usr/tests/nextbsd/kext/run.sh
          chmod 755 extra/usr/tests/nextbsd/kext/run.sh
          sh nextbsd-ci/scripts/assemble-image.sh

      - name: Upload assembled kext image
        uses: actions/upload-artifact@v4
        with:
          name: kext-ci-image-${{ matrix.target }}
          path: nbimg/out/disk.img

  kext-boot:
    # Per-arch display gate: IOKit picks each arch's NATIVE display kext, so
    # the lane asserts bochs (amd64's first/boot VGA — unremovable, OVMF
    # depends on it) and virtio (arm64's only video device). The amd64
    # virtio-gpu add-on (vgap gap, nextbsd-ci#6) is tracked as a warn, not a
    # gate. See tests/overlay-kext.tsv.
    name: kext boot test (per-arch display kext, qemu)
    needs: [kext-image]
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: amd64
            runner: ubuntu-24.04
          - target: arm64
            runner: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4          # kernel-extensions: tests/ + the harness wrapper

      - name: Download assembled kext image
        uses: actions/download-artifact@v4
        with:
          name: kext-ci-image-${{ matrix.target }}
          path: .

      - name: Checkout shared boot harness (nextbsd-ci, pinned)
        uses: actions/checkout@v4
        with:
          repository: nextbsd/nextbsd-ci
          ref: v0.3.5
          path: nextbsd-ci

      - name: Install qemu + expect + UEFI firmware
        run: |
          sudo apt-get update
          if [ "${{ matrix.target }}" = "arm64" ]; then
            # -M virt guests use AAVMF, not OVMF (same split as the kernel
            # arm64 smoke lane); the native aarch64 runner runs qemu-system-arm.
            sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-efi-aarch64 expect
          else
            sudo apt-get install -y --no-install-recommends qemu-system-x86 expect ovmf
          fi

      # The on-image test (baked in by the assembly step) does the GPU
      # validation: kextd autoloads the VirtIOGraphics kext on the virtio-gpu
      # device, and it kextstat-checks it + emits the sentinel. The thin
      # wrapper runs it via the shared harness; the same assertion on both
      # arches is the point.
      - name: Boot test (shared harness, on-image kextstat)
        env:
          # The assembled image is named disk.img (no arch in the name), so the
          # harness cannot infer the arch from it; pass the matrix arch or the
          # arm64 leg mis-infers amd64 and looks for amd64 OVMF firmware (which
          # is not on the arm runner). Same env the userland boot job passes.
          ARCH: ${{ matrix.target }}
        run: |
          chmod +x tests/kext-boot-test.sh
          ./tests/kext-boot-test.sh disk.img

      - name: Upload kext boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kext-boot-log
          path: boot-test.log
          if-no-files-found: ignore

  # Refresh the rolling `continuous` release from a successful main build, so
  # nextbsd ingests a stable, CI-gated module tree instead of scraping the
  # latest main run artifact. Single non-matrix job (collects both arches,
  # publishes once — no release-creation race). PRs build but never reach here.
  publish:
    name: publish continuous
    needs: [modules, drm-kmod, nvidia-build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout (tools/)
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package per-arch assets
        run: |
          mkdir -p out
          for arch in amd64 arm64; do
            # nextbsd-modules-<arch>.tar.gz: the built *.ko module tree,
            # consumed by nextbsd (installs them into /boot/kernel on the ISO).
            if [ -d "artifacts/nextbsd-modules-$arch" ]; then
              tar -C "artifacts/nextbsd-modules-$arch" -czf "out/nextbsd-modules-$arch.tar.gz" .
            fi
          done
          # rpi5-overlays.tar.gz: device-tree overlays that must land on the
          # Pi's FAT32 firmware partition, which no package can write -- pkg(8)
          # installs into the UFS root and that partition is not mounted at
          # install time. So the image build stages them, and gets them from
          # here (nextbsd/nextbsd#429).
          #
          # Shipped from this repo rather than the image repo so an overlay
          # stays versioned with the driver it enables: the two have to agree
          # about the node's compatible string, and splitting them invites
          # drift.
          #
          # Collected from every graphics/*/overlays directory rather than just
          # a module, so a module can carry its own without this step needing
          # to be edited again. The .dtbo is committed next to its .dts --
          # nothing here runs dtc, and a source-only overlay would tar cleanly
          # and then not exist at boot, so the count check below is what makes
          # that loud instead of silent.
          _ovl_n=0
          rm -rf out/_overlays && mkdir -p out/_overlays
          for _d in graphics/*/overlays; do
            [ -d "$_d" ] || continue
            for _f in "$_d"/*.dtbo "$_d"/*.dts; do
              [ -e "$_f" ] || continue
              _b=$(basename "$_f")
              if [ -e "out/_overlays/$_b" ]; then
                echo "::error::duplicate overlay name $_b (in $_d and elsewhere)"
                exit 1
              fi
              cp "$_f" out/_overlays/
            done
          done
          _ovl_n=$(ls out/_overlays/*.dtbo 2>/dev/null | wc -l | tr -d ' ')
          if [ "$_ovl_n" -eq 0 ]; then
            echo "::error::no .dtbo found under graphics/*/overlays -- the rpi5 image would ship without device-tree overlays and KMS would not bind"
            exit 1
          fi
          # Every .dts must have its compiled .dtbo committed beside it.
          for _s in out/_overlays/*.dts; do
            [ -e "$_s" ] || continue
            [ -e "${_s%.dts}.dtbo" ] || { echo "::error::$(basename "$_s") has no committed .dtbo"; exit 1; }
          done
          # Refuse anything that is not a flattened device tree, rather than
          # letting the image build discover it later.
          for _o in out/_overlays/*.dtbo; do
            _m=$(dd if="$_o" bs=1 count=4 2>/dev/null | od -An -tx1 | tr -d ' \n')
            [ "$_m" = "d00dfeed" ] || { echo "::error::$(basename "$_o") is not a device tree (magic=$_m)"; exit 1; }
          done
          tar -C out/_overlays -czf out/rpi5-overlays.tar.gz .
          rm -rf out/_overlays
          echo "==> rpi5-overlays.tar.gz ($_ovl_n overlays):"
          tar tzf out/rpi5-overlays.tar.gz
          ls -lh out/
          ls -lh out/

      # Build the SHIPPED IntelWiFi.kext (amd64) with the FULL Intel iwlwifi
      # firmware set bundled in, and publish it as intelwifi-kext.tar.gz on the
      # continuous release (picked up by out/*.tar.gz below). nextbsd installs it
      # into the ISO's /System/Library/Extensions; the kernel finds the firmware
      # via the firmware_path search list (nextbsd-kernel patch 0004) once the
      # image's loader.conf points at the kext's firmware dir. One kext supports
      # every iwlwifi model (7260 .. AX210 .. BE200). Intel permits unmodified
      # binary redistribution provided the licence ships alongside (bundled).
      - name: Build + bundle IntelWiFi.kext (full iwlwifi firmware)
        run: |
          chmod +x tools/ko2kext.sh
          IWKO=$(find artifacts/nextbsd-modules-amd64 -type f -name if_iwlwifi.ko | head -1)
          if [ -z "$IWKO" ]; then
            echo "WARN: if_iwlwifi.ko not in modules artifact — skipping IntelWiFi.kext"
          else
            FW_TAG=20260519
            rm -rf lf
            git clone --depth 1 --branch "$FW_TAG" --filter=blob:none --sparse \
                https://gitlab.com/kernel-firmware/linux-firmware.git lf
            ( cd lf && git sparse-checkout set --no-cone intel/iwlwifi LICENCE.iwlwifi_firmware )
            cp -L lf/LICENCE.iwlwifi_firmware lf/intel/iwlwifi/
            PERS=artifacts/intelwifi-personalities/IntelWiFi.iokitpersonalities
            test -f "$PERS" || { echo "personalities fragment missing: $PERS" >&2; exit 1; }
            tools/ko2kext.sh -f lf/intel/iwlwifi -p "$PERS" "$IWKO" IntelWiFi org.nextbsd.kext.intelwifi
            echo "==> IntelWiFi.kext: $(find IntelWiFi.kext/Contents/Resources/firmware -type f | wc -l) firmware files, $(du -sh IntelWiFi.kext | cut -f1), IOKitPersonalities injected"
            tar -czf out/intelwifi-kext.tar.gz IntelWiFi.kext
            ls -lh out/intelwifi-kext.tar.gz
          fi

      # Build the SHIPPED IntelEthernet.kext (amd64) from if_em.ko and publish it
      # as intelethernet-kext.tar.gz (#219). No firmware — e1000 is a pure driver.
      # nextbsd installs it into the ISO's /System/Library/Extensions; once the
      # kernel drops `device em` (the follow-on kernel PR), the matcher auto-loads
      # this kext when the e1000 attaches. One kext covers the whole Intel GbE
      # family (em + igb).
      - name: Build + bundle IntelEthernet.kext (if_em)
        run: |
          chmod +x tools/ko2kext.sh
          EMKO=$(find artifacts/nextbsd-modules-amd64 -type f -name if_em.ko | head -1)
          if [ -z "$EMKO" ]; then
            echo "WARN: if_em.ko not in modules artifact — skipping IntelEthernet.kext"
          else
            PERS=artifacts/intelethernet-personalities/IntelEthernet.iokitpersonalities
            test -f "$PERS" || { echo "personalities fragment missing: $PERS" >&2; exit 1; }
            tools/ko2kext.sh -p "$PERS" "$EMKO" IntelEthernet org.nextbsd.kext.intelethernet
            echo "==> IntelEthernet.kext: $(du -sh IntelEthernet.kext | cut -f1), IOKitPersonalities injected"
            tar -czf out/intelethernet-kext.tar.gz IntelEthernet.kext
            ls -lh out/intelethernet-kext.tar.gz
          fi

      # Build the SHIPPED graphics stack: the drm-kmod job already wrapped +
      # validated the bundles (drm core + the GPU drivers each arch has, with the
      # OSBundleLibraries dependency chain + device-id tables) into the
      # graphics-kexts-<arch> artifacts. Here we inject the FULL per-vendor firmware
      # each driver requests by its vendor prefix (firmware/i915/*, firmware/
      # amdgpu/*, firmware/radeon/*) from linux-firmware (KBI-independent blobs),
      # and ship each arch's stack as graphics-kexts-<arch>.tar.gz. amdgpu firmware is
      # large (hundreds of MB) — self-contained kext per the bundle-in-kext model.
      #
      # BOTH arches ship: the drm-kmod job builds and validates arm64 kexts too
      # (drm core + the virtio-gpu trio: LinuxVirtIO, IOGraphicsShmem,
      # VirtIOGraphics), and until now that artifact was downloaded here and then
      # never read, so the arm64 kexts never reached the release and
      # nextbsd-pkg had nothing to package. The asset is per-arch because the
      # two arches ship DIFFERENT kext sets of the same names — one arch-less
      # tarball cannot represent both.
      - name: Build + bundle graphics kexts (drm core + GPU drivers, full firmware)
        run: |
          set -eu
          # linux-firmware sparse: the three GPU vendor dirs + their licenses.
          # Fetched once, outside the per-arch loop — the blobs are KBI- and
          # arch-independent, so both arches inject from the same checkout.
          FW_TAG=20260519
          rm -rf lf
          git clone --depth 1 --branch "$FW_TAG" --filter=blob:none --sparse \
              https://gitlab.com/kernel-firmware/linux-firmware.git lf
          ( cd lf && git sparse-checkout set --no-cone i915 amdgpu radeon \
              LICENSE.amdgpu LICENSE.radeon LICENSE.i915 )
          # Inject firmware preserving the vendor subdir the driver asks for
          # (cp -RL dereferences linux-firmware's versioned symlinks to real files).
          # Guarded on the .kext existing, not on the arch: arm64 ships none of
          # these three (no i915 on aarch64; amdgpu/radeon build but are not
          # packaged there), so each call is a no-op announcement on that leg.
          inject() { # <kext-dir> <kext-name> <vendor-dir> <license-file>
            kext="$1/$2.kext"; vdir="$3"; lic="$4"
            [ -d "$kext" ] || { echo "  $2.kext absent — skip"; return 0; }
            [ -d "lf/$vdir" ] || { echo "  WARN: lf/$vdir missing — $2.kext ships driver-only"; return 0; }
            fwd="$kext/Contents/Resources/firmware"; mkdir -p "$fwd"
            cp -RL "lf/$vdir" "$fwd/"
            [ -f "lf/$lic" ] && cp -L "lf/$lic" "$fwd/" || true
            echo "  $2.kext: $(find "$fwd" -type f | wc -l | tr -d ' ') fw files, $(du -sh "$kext" | cut -f1)"
          }
          for arch in amd64 arm64; do
            GFX=$(find "artifacts/graphics-kexts-$arch" -maxdepth 3 -name '*.kext' -type d 2>/dev/null | head -1)
            if [ -z "$GFX" ]; then
              echo "WARN: graphics-kexts-$arch artifact has no kexts — skipping $arch graphics kexts"
              continue
            fi
            GDIR=$(dirname "$GFX")
            echo "=== $arch graphics kexts at: $GDIR"; ls -1 "$GDIR"
            inject "$GDIR" IntelGraphics  i915   LICENSE.i915
            inject "$GDIR" AMDGraphics    amdgpu LICENSE.amdgpu
            inject "$GDIR" RadeonGraphics radeon LICENSE.radeon
            # One asset per arch for the whole graphics stack (drm core kexts carry
            # no firmware but must ship so the dependency chain resolves at load).
            tar -C "$GDIR" -czf "out/graphics-kexts-$arch.tar.gz" .
            echo "==> graphics-kexts-$arch.tar.gz: $(du -sh "out/graphics-kexts-$arch.tar.gz" | cut -f1)"
          done

      # NVIDIA: the chained NVIDIAGraphics595 kext (+ modeset/core) already carries
      # its GSP firmware (bundled at wrap time via ko2kext -f), so unlike the drm
      # stack there's no firmware to inject here — just ship it. Asset name matches
      # nextbsd-pkg's `*kext*.tar.gz` ingest glob, so it's packaged automatically.
      - name: Bundle NVIDIA kexts (NVIDIAGraphics595 + chain)
        run: |
          set -eu
          NV=$(find artifacts/nvidia-kexts-amd64 -maxdepth 2 -name 'NVIDIAGraphics595.kext' -type d 2>/dev/null | head -1)
          if [ -z "$NV" ]; then
            echo "WARN: nvidia-kexts-amd64 artifact has no kexts — skipping nvidia kexts"
          else
            NDIR=$(dirname "$NV")
            echo "nvidia kexts at: $NDIR"; ls -1 "$NDIR"
            tar -C "$NDIR" -czf out/nvidia-kexts.tar.gz .
            echo "==> nvidia-kexts.tar.gz: $(du -sh out/nvidia-kexts.tar.gz | cut -f1)"
          fi

      # Stable asset names → each publish overwrites in place; no stale pileup.
      - name: Publish to continuous release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Continuous modules build
          body: |
            Rolling module build, refreshed on every successful `main` build.
            Consumed by nextbsd: `nextbsd-modules-<arch>.tar.gz` (the *.ko tree,
            installed into /boot/kernel), `intelwifi-kext.tar.gz` (the
            IntelWiFi.kext bundle with the full iwlwifi firmware set) and
            `intelethernet-kext.tar.gz` (the IntelEthernet.kext bundle, if_em /
            Intel GbE family) and `graphics-kexts-<arch>.tar.gz` (the drm-kmod
            graphics stack: IOGraphics/DMABuf/TTM drm core, plus IntelGraphics/
            AMDGraphics/RadeonGraphics on amd64 and the virtio-gpu trio
            (LinuxVirtIO/IOGraphicsShmem/VirtIOGraphics) on both, each with its
            device-id match table + bundled vendor firmware) — all installed into
            /System/Library/Extensions.

            Build log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Commit: ${{ github.sha }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: |
            out/*.tar.gz

      # The NVIDIA kexts now build in nextbsd-kernel-extensions-nvidia, against the
      # drm.ko in the graphics-kexts-amd64.tar.gz just published (nextbsd/nextbsd#547).
      # Tell it there is a new graphics build: kernel -> graphics -> NVIDIA.
      - name: Trigger the NVIDIA kext build
        run: |
          gh api repos/nextbsd/nextbsd-kernel-extensions-nvidia/dispatches \
            -f event_type=graphics-updated \
            -f "client_payload[fbsd_sha]=${{ github.event.client_payload.fbsd_sha || inputs.fbsd_sha }}" \
            -f "client_payload[sha]=${{ github.sha }}"
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}

  # EXPERIMENTAL (NVIDIA kext series, step 2 / nextbsd#384): prove NVIDIA's
  # closed-source kmods BUILD against our patched 15.1 kernel obj before wrapping
  # them into a NVIDIAGraphics kext. Mirrors the drm-kmod job (same container,
  # kernel-obj download, nextbsd-kernel patch re-apply, `make.py ... buildenv`).
  # Source is a tarball fetch (not a git clone); we replicate FreeBSD's
  # x11/nvidia-kmod port fetch+patch by hand: SUB_PATCHES (the .in unified diffs,
  # %%NVSRC%%->nvidia, patch -p0) then the post-patch REINPLACE edits via
  # tools/nvidia-portpatch.sh (transcribed 1:1, locally verified vs the real
  # 595.84 source). Driver 595.84 is amd64-only (prebuilt x86_64 nv-kernel blob).
  # Builds all three modules the NVIDIAGraphics595 kext needs: nvidia.ko +
  # nvidia-modeset.ko (src/Makefile) then nvidia-drm.ko (src/nvidia-drm, a separate
  # port needing DRMKMODDIR = drm-kmod 6.12-lts source). PR-gated, compile-only,
  # gates nothing (publish untouched) so it can be iterated freely.
  nvidia-build:
    name: nvidia build (nvidia/nvidia-modeset/nvidia-drm, amd64)
    # Runs on PRs (compile check) and on main (so publish can ship the kexts).
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    # nvidia-drm's conftest.sh detects the DRM API by nm-ing the built drm.ko et al.
    # (via CONFTEST_BSD_KMODPATHS), so we need drm-kmod's compiled modules artifact.
    needs: drm-kmod
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/nextbsd/nextbsd-kernel-toolchain:amd64-${{ (github.event.client_payload.fbsd_sha || inputs.fbsd_sha) && format('fbsd-{0}', github.event.client_payload.fbsd_sha || inputs.fbsd_sha) || 'latest' }}
    env:
      NVIDIA_DISTVERSION: "595.84"
      PORTS_FILES: "https://raw.githubusercontent.com/freebsd/freebsd-ports/main/x11/nvidia-driver/files"
    steps:
      - name: Download kernel obj tree from kernel continuous release
        env:
          # Reads a public `continuous` release asset — no PAT needed; the
          # built-in github.token authenticates gh for public reads and lets
          # fork PRs run this step (they get a read-only github.token, no secrets).
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /usr/obj
          gh release download continuous \
            --repo nextbsd/nextbsd-kernel \
            --pattern "kernel-obj-amd64.tar.gz" \
            --output /tmp/kernel-obj.tar.gz --clobber
          tar -C /usr/obj -xzf /tmp/kernel-obj.tar.gz

      - name: Apply patches to source
        run: |
          cd /usr/src
          git clone --depth 1 https://github.com/nextbsd/nextbsd-kernel.git /tmp/nk
          for p in $(cat /tmp/nk/patches/series); do
            echo "Applying $p"
            git apply /tmp/nk/patches/$p
          done
          cp /tmp/nk/config/NEXTBSD /usr/src/sys/amd64/conf/

      - name: Checkout tools (nvidia-portpatch)
        uses: actions/checkout@v4
        with:
          path: nbkm-tools

      - name: Fetch + patch NVIDIA source (SUB_PATCHES + port REINPLACE edits)
        run: |
          set -eu
          V="${NVIDIA_DISTVERSION}"
          WRKSRC="/tmp/nvw/NVIDIA-FreeBSD-x86_64-${V}"
          mkdir -p /tmp/nvw
          curl -fLo /tmp/nvidia.tar.xz \
            "https://download.nvidia.com/XFree86/FreeBSD-x86_64/${V}/NVIDIA-FreeBSD-x86_64-${V}.tar.xz"
          tar -C /tmp/nvw -xJf /tmp/nvidia.tar.xz
          # SUB_PATCHES that pass the NVVERSION guards at 595.084 (Makefile,
          # nv-freebsd.h, Makefile-2 >=580, gsp firmware-registry >=565). Only
          # token is %%NVSRC%% -> nvidia; unified diffs are src/-prefixed => -p0.
          for p in extra-patch-src-Makefile extra-patch-src-nv-freebsd.h \
                   extra-patch-src-Makefile-2 \
                   extra-gsp-patch-src-common-inc-nv_firmware_registry.h ; do
            curl -fsSL "${PORTS_FILES}/${p}.in" | sed 's/%%NVSRC%%/nvidia/g' > "/tmp/${p}"
            echo "applying SUB_PATCH ${p}"
            patch --forward -E -p0 -d "${WRKSRC}" < "/tmp/${p}"
          done
          # drm-kmod 6.12-lts source = DRMKMODDIR for nvidia-drm (headers/.mk only,
          # matching the drm.ko NextBSD ships from #337; drm.ko is a runtime dep).
          git clone --depth 1 --branch "${DRM_KMOD_REF}" \
            https://github.com/freebsd/drm-kmod.git /tmp/drm-kmod
          # post-patch REINPLACE edits: nvidia-kmod core + nvidia-drm (NVPP_DRM=1
          # adds the fbdev/const-cast/pm_vt_switch/dummy-include edits from
          # graphics/nvidia-drm-kmod/Makefile.common). All verified vs real source.
          chmod +x nbkm-tools/tools/nvidia-portpatch.sh
          NVPP_DRM=1 nbkm-tools/tools/nvidia-portpatch.sh "${WRKSRC}" nvidia

      - name: Build nvidia.ko + nvidia-modeset.ko against the kernel obj
        run: |
          NPROC=$(nproc)
          WRKSRC="/tmp/nvw/NVIDIA-FreeBSD-x86_64-${NVIDIA_DISTVERSION}"
          cd /usr/src
          ./tools/build/make.py \
            --cross-bindir="${CROSS_BINDIR}" \
            TARGET=amd64 TARGET_ARCH=amd64 KERNCONF=NEXTBSD \
            buildenv BUILDENV_SHELL="make -C ${WRKSRC} -j${NPROC} SYSDIR=/usr/src/sys"

      - name: Download drm-kmod modules (drm.ko for nvidia-drm conftest)
        uses: actions/download-artifact@v4
        with:
          name: drm-kmod-modules-amd64
          path: /tmp/drm-ko

      - name: Build nvidia-drm.ko against the kernel obj + drm-612 source
        run: |
          NPROC=$(nproc)
          WRKSRC="/tmp/nvw/NVIDIA-FreeBSD-x86_64-${NVIDIA_DISTVERSION}"
          cd /usr/src
          # nvidia-drm is a separate port (graphics/nvidia-drm-612-kmod): build
          # src/nvidia-drm with DRMKMODDIR = the 6.12-lts SOURCE (headers/conftest).
          # NVIDIA's conftest.sh detects the DRM API by nm-ing the built drm.ko et al.
          # (drm_connector_attach_encoder etc. are T-exported there). It finds them via
          # `sysctl kern.module_path`, which fails on this Linux host — so we set
          # CONFTEST_BSD_KMODPATHS (conftest.sh's documented override) to the built
          # drm-kmod modules dir, skipping the sysctl. This is the cross-host fix (#384).
          ./tools/build/make.py \
            --cross-bindir="${CROSS_BINDIR}" \
            TARGET=amd64 TARGET_ARCH=amd64 KERNCONF=NEXTBSD \
            buildenv BUILDENV_SHELL="env CONFTEST_BSD_KMODPATHS=/tmp/drm-ko make -C ${WRKSRC}/src/nvidia-drm -j${NPROC} SYSDIR=/usr/src/sys DRMKMODDIR=/tmp/drm-kmod/"

      - name: Collect + gate the NVIDIA .ko output
        run: |
          WRKSRC="/tmp/nvw/NVIDIA-FreeBSD-x86_64-${NVIDIA_DISTVERSION}"
          mkdir -p /tmp/nv-ko
          find "${WRKSRC}" "${MAKEOBJDIRPREFIX:-/usr/obj}" -name '*.ko' 2>/dev/null \
            -exec cp -v {} /tmp/nv-ko/ \; || true
          echo "=== collected .ko files ==="
          ls -lh /tmp/nv-ko || true
          for ko in nvidia nvidia-modeset nvidia-drm; do
            test -f "/tmp/nv-ko/${ko}.ko" || { echo "FAIL: required ${ko}.ko not built" >&2; exit 1; }
            echo "  OK ${ko}.ko"
          done
          echo "nvidia-build: nvidia.ko + nvidia-modeset.ko + nvidia-drm.ko compiled against the 15.1 kernel obj + drm-612"

      - name: Upload NVIDIA modules artifact
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-modules-amd64
          path: /tmp/nv-ko/*.ko
          if-no-files-found: warn

      # Wrap the three .ko's into the chained NVIDIAGraphics595 kext (#385): one
      # kext per .ko, OSBundleLibraries-chained like IntelGraphics->IOGraphics.
      # NVIDIAGraphics595 (nvidia-drm, the load target) -> NVIDIAModeset595 ->
      # NVIDIACore595, and -> IOGraphics (drmn). Carries the Turing+ personalities
      # (from the driver's own supported-gpus.json) + the GSP firmware blobs.
      - name: Wrap the chained NVIDIAGraphics595 kexts
        run: |
          set -eu
          WRKSRC="/tmp/nvw/NVIDIA-FreeBSD-x86_64-${NVIDIA_DISTVERSION}"
          T=nbkm-tools/tools
          chmod +x "$T"/ko2kext.sh "$T"/gen-nvidia-personalities.sh
          O=nvidia-kexts; mkdir -p "$O" pers
          # Turing+ match table = the current unified driver's chips (no legacybranch;
          # 595 dropped Maxwell/Pascal/Volta to the 580 branch).
          "$T/gen-nvidia-personalities.sh" \
            "$WRKSRC/doc/supported-gpus/supported-gpus.json" \
            org.nextbsd.driver.nvidiagraphics595 NVIDIAGraphics595 \
            > pers/NVIDIAGraphics595.iokitpersonalities
          # core (leaf) <- modeset <- drm. NVIDIA omits TTM/DMABuf (own memmgr); the
          # drm bridge links the shared drmn core (IOGraphics) + carries personalities
          # + GSP firmware (gsp_tu10x/ga10x.bin) in Contents/Resources/firmware/.
          "$T/ko2kext.sh" -o "$O" /tmp/nv-ko/nvidia.ko NVIDIACore595 org.nextbsd.driver.nvidiacore595
          "$T/ko2kext.sh" -o "$O" -l org.nextbsd.driver.nvidiacore595 \
            /tmp/nv-ko/nvidia-modeset.ko NVIDIAModeset595 org.nextbsd.driver.nvidiamodeset595
          "$T/ko2kext.sh" -o "$O" \
            -l org.nextbsd.driver.nvidiamodeset595 -l org.nextbsd.kext.iographics \
            -p pers/NVIDIAGraphics595.iokitpersonalities \
            -f "$WRKSRC/firmware/gsp_tu10x/gsp_tu10x.bin" \
            -f "$WRKSRC/firmware/gsp_ga10x/gsp_ga10x.bin" \
            /tmp/nv-ko/nvidia-drm.ko NVIDIAGraphics595 org.nextbsd.driver.nvidiagraphics595
          echo "=== wrapped kexts ==="
          for d in "$O"/*.kext; do echo "  $(basename "$d") ($(du -sh "$d"|cut -f1))"; done

      # Mesa's libgbm.so.1 loader — 14 KB, DT_NEEDED = libdrm/libthr/libc only. The
      # bundle needs it because libnvidia-egl-gbm.so.1 NEEDs it; shipping it INSIDE the
      # bundle is what keeps NextBSD-kernel-extensions off mesa-libs -> llvm19 (1.9 GB
      # installed), which is what blew the base image past GitHub's 2 GiB asset cap.
      # See nextbsd/nextbsd#388 and the long WHY in nvidia-mkbundle.sh.
      # BUILD-TIME ONLY: we take one file out of the mesa-libs package; nothing in the
      # shipped image depends on mesa.
      - name: Fetch Mesa's libgbm.so.1 loader (build-time only, no mesa/LLVM runtime dep)
        run: |
          set -eu
          # We run inside the kernel-toolchain container as root: no sudo, and zstd is
          # not in the image. pkg(8) repo files are zstd tarballs, so make sure we can
          # read one. (readelf is already present — the bundle closure check uses it.)
          if ! command -v zstd >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq --no-install-recommends zstd
          fi
          REPO="https://pkg.FreeBSD.org/FreeBSD:15:amd64/latest"
          W=/tmp/gbm; rm -rf "$W"; mkdir -p "$W"
          # Resolve mesa-libs' hashed repopath out of the repo catalogue (it is version
          # -stamped, so it cannot be hardcoded without rotting). packagesite.yaml is one
          # compact JSON object per line — no jq/python needed, and neither is guaranteed
          # to be in this container.
          curl -fsSL -o "$W/packagesite.pkg" "$REPO/packagesite.pkg"
          zstd -dc "$W/packagesite.pkg" | tar -xf - -C "$W" packagesite.yaml
          REPOPATH=$(grep -m1 '"name":"mesa-libs"' "$W/packagesite.yaml" \
                     | sed -n 's/.*"repopath":"\([^"]*\)".*/\1/p')
          [ -n "$REPOPATH" ] || { echo "FAIL: mesa-libs absent from the repo catalogue" >&2; exit 1; }
          echo "  mesa-libs -> $REPOPATH"
          curl -fsSL -o "$W/mesa-libs.pkg" "$REPO/$REPOPATH"
          zstd -dc "$W/mesa-libs.pkg" | tar -xf - -C "$W" 2>/dev/null || true
          GBM=$(find "$W" -name 'libgbm.so.1*' -type f | head -1)
          [ -n "$GBM" ] || { echo "FAIL: libgbm.so.1 not in the mesa-libs package" >&2; exit 1; }
          echo "  found $GBM ($(du -h "$GBM" | cut -f1))"
          readelf -d "$GBM" | sed -n 's/.*(NEEDED).*\[\(.*\)\].*/    NEEDED \1/p'
          # Guard the premise: the loader must not itself pull gallium/LLVM in.
          if readelf -d "$GBM" | grep -qE 'NEEDED.*(gallium|LLVM)'; then
            echo "FAIL: this Mesa's libgbm NEEDs gallium/LLVM — bundling it would reintroduce" >&2
            echo "  the llvm19 dependency. Do not bundle; see nextbsd/nextbsd#388." >&2
            exit 1
          fi
          echo "NVBUNDLE_LIBGBM=$GBM" >> "$GITHUB_ENV"

      # Userland half (#385 follow-on): a GPU driver is two layers — the kexts above
      # are the kernel half; this stages NVIDIA's precompiled X11/GL/EGL/GBM userland
      # from the SAME tarball's obj/ into a version-locked sibling NVIDIA595.bundle,
      # dropped INTO the nvidia-kexts dir so it rides the artifact + nvidia-kexts.tar.gz
      # into NextBSD-kernel-extensions (nextbsd-pkg runs the bundle's nvidia-activate.sh
      # to symlink it into /usr/local). No compile — pure stage. Repeatable per branch.
      - name: Stage the NVIDIA595 userland bundle (sibling to the kexts)
        run: |
          set -eu
          WRKSRC="/tmp/nvw/NVIDIA-FreeBSD-x86_64-${NVIDIA_DISTVERSION}"
          chmod +x nbkm-tools/tools/nvidia-mkbundle.sh nbkm-tools/tools/nvidia-activate.sh
          nbkm-tools/tools/nvidia-mkbundle.sh "$WRKSRC" "${NVIDIA_DISTVERSION}" nvidia-kexts
          B=nvidia-kexts/NVIDIA595.bundle
          for f in Contents/Info.plist \
                   Contents/Resources/xorg/drivers/nvidia_drv.so \
                   Contents/Resources/xorg/extensions/libglxserver_nvidia.so.1 \
                   Contents/Resources/lib/libGLX_nvidia.so.0 \
                   Contents/Resources/lib/libnvidia-glcore.so.1 \
                   Contents/Resources/lib/libnvidia-egl-gbm.so.1 \
                   Contents/Resources/lib/libgbm.so.1 \
                   Contents/Resources/lib/gbm/nvidia-drm_gbm.so \
                   Contents/Resources/share/glvnd/egl_vendor.d/10_nvidia.json \
                   Contents/Resources/etc/libmap.d/nvidia.conf \
                   Contents/Resources/nvidia-activate.sh; do
            test -e "$B/$f" || { echo "FAIL: NVIDIA595.bundle missing $f" >&2; exit 1; }
          done
          test -f "$B/Contents/Resources/lib/gbm/nvidia-drm_gbm.so" \
            || { echo "FAIL: gbm backend symlink dangling" >&2; exit 1; }
          # The whole point of nextbsd#388: NOTHING the bundle NEEDs may resolve to
          # mesa-libs. libgbm.so.1 must come from inside the bundle, never from a dep.
          for f in "$B"/Contents/Resources/lib/*.so.* "$B"/Contents/Resources/xorg/drivers/*.so; do
            [ -f "$f" ] || continue
            for n in $(readelf -d "$f" 2>/dev/null | sed -n 's/.*NEEDED.*\[\(lib[^]]*\)\].*/\1/p'); do
              case "$n" in
                libgbm.so.*) test -f "$B/Contents/Resources/lib/$n" \
                  || { echo "FAIL: $(basename "$f") NEEDs $n, not in bundle -> pkg would dep on mesa-libs -> llvm19" >&2; exit 1; } ;;
                *gallium*|*LLVM*) echo "FAIL: $(basename "$f") NEEDs $n — LLVM must not enter the bundle" >&2; exit 1 ;;
              esac
            done
          done
          echo "  bundle NEEDs no mesa-libs / llvm19 (nextbsd#388)"
          echo "=== nvidia-kexts dir now holds (kernel kexts + userland bundle) ==="
          for d in nvidia-kexts/*.kext nvidia-kexts/*.bundle; do
            [ -e "$d" ] && echo "  $(basename "$d") ($(du -sh "$d"|cut -f1))"
          done

      - name: Validate the NVIDIA kext bundles
        run: |
          python3 - nvidia-kexts <<'PY'
          import plistlib, sys, os
          O = sys.argv[1]
          def info(n): return plistlib.load(open(f"{O}/{n}.kext/Contents/Info.plist","rb"))
          chain = {
            'NVIDIACore595':     ('org.nextbsd.driver.nvidiacore595', []),
            'NVIDIAModeset595':  ('org.nextbsd.driver.nvidiamodeset595', ['org.nextbsd.driver.nvidiacore595']),
            'NVIDIAGraphics595': ('org.nextbsd.driver.nvidiagraphics595',
                                  ['org.nextbsd.driver.nvidiamodeset595','org.nextbsd.kext.iographics']),
          }
          for name,(bid,deps) in chain.items():
              d = info(name)
              assert d['CFBundleIdentifier'] == bid, (name, d['CFBundleIdentifier'])
              libs = d.get('OSBundleLibraries', {})
              for dep in deps: assert dep in libs, (name, 'missing OSBundleLibraries dep', dep)
              print(f"{name}: id ok, deps {sorted(libs)}")
          g = info('NVIDIAGraphics595')
          p = g['IOKitPersonalities']['NVIDIAGraphics595']
          ids = p['IOPCIPrimaryMatch'].split()
          assert ids and all(x.startswith('0x') and x.endswith('10de') and len(x)==10 for x in ids), ids[:3]
          fw = sorted(os.listdir(f"{O}/NVIDIAGraphics595.kext/Contents/Resources/firmware"))
          assert fw == ['gsp_ga10x.bin','gsp_tu10x.bin'], fw
          print(f"NVIDIAGraphics595: {len(ids)} Turing+ ids (0x10de), firmware {fw}")
          print("NVIDIA kext bundles OK (chain + personalities + firmware)")
          PY

      - name: Upload NVIDIA kexts artifact
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-kexts-amd64
          path: nvidia-kexts
          if-no-files-found: warn
